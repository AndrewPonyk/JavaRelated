[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tsa-backend"
version = "0.1.0"
description = "Time-Series Analytics — FastAPI backend and workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cassandra-driver>=3.29",
    # Py3.12 removed asyncore; the driver needs it when the libev C extension
    # is absent from the wheel (Windows dev, some slim images). Pure-python shim.
    "pyasyncore>=1.0.2; python_version >= '3.12'",
    "redis>=5.0",
    "influxdb-client>=1.44",
    "PyJWT>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Prophet is heavy (cmdstan); only the anomaly worker needs it.
# The z-score fallback keeps detection functional without this extra.
ml = [
    "prophet>=1.1.5",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "requires_stack: needs live Cassandra/Redis (docker compose up cassandra redis)",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
