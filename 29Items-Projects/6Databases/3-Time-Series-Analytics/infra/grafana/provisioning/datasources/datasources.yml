# Grafana datasource provisioning — mounted read-only by docker-compose.
# Values come from container env (see grafana service in docker-compose.yml).
apiVersion: 1

datasources:
  - name: InfluxDB (platform metrics)
    uid: tsa-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET
      tlsSkipVerify: true # dev only; TODO prod: proper TLS
    secureJsonData:
      token: $INFLUXDB_TOKEN

