# Grafana dashboard provider — loads every JSON in /var/lib/grafana/dashboards
# (mounted from infra/grafana/dashboards). Dashboards are CODE: edit in the UI,
# then export back into the repo (docs/TECH-NOTES.md §3.6 pitfall 8).
apiVersion: 1

providers:
  - name: tsa-dashboards
    orgId: 1
    folder: "Time-Series Analytics"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
