server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers. CSP is deliberately left to the LB/edge:
    # the app uses inline style attributes, so a useful CSP needs planning.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API: proxy to the backend service (compose network name)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/api/v1/events/...): disable buffering so events flush through.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
