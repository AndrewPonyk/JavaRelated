# =============================================================================
# Time-Series Analytics — GitLab CI/CD root pipeline
# Keep this file a table of contents; jobs live in ci/*.gitlab-ci.yml.
# Pipeline: lint → test → build → deploy   (see docs/TECH-NOTES.md §3.1)
# =============================================================================

stages:
  - lint
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

variables:
  PYTHON_IMAGE: "python:3.12-slim"
  NODE_IMAGE: "node:22-alpine"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

default:
  interruptible: true

include:
  - local: ci/lint.gitlab-ci.yml
  - local: ci/test.gitlab-ci.yml
  - local: ci/build.gitlab-ci.yml
  - local: ci/deploy.gitlab-ci.yml
