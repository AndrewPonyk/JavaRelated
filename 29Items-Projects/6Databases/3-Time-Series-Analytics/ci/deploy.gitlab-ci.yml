# Stage: deploy — SSH to a DigitalOcean droplet: sync migrations, apply them,
# pull images, compose up. Rollback = redeploy the previous tag.
#
# Required GitLab CI/CD variables (Settings → CI/CD → Variables, masked/protected):
#   DEPLOY_SSH_PRIVATE_KEY  private key for the droplet's `deploy` user (protected)
#   SSH_KNOWN_HOSTS         optional pinned host keys; accept-new is the fallback
#   DO_STAGING_HOST         e.g. deploy@staging.example.com
#   DO_PRODUCTION_HOST      e.g. deploy@app.example.com   (protected)
# Host is bootstrapped once via infra/digitalocean/droplet-setup.sh.

.deploy-template:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        printf 'StrictHostKeyChecking accept-new\n' > ~/.ssh/config
      fi
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # 1) Sync deployment inputs (compose files, migrations, scripts).
    - ssh "$DEPLOY_HOST" "mkdir -p /opt/tsa/backend /opt/tsa/scripts"
    - scp docker-compose.yml docker-compose.prod.yml "$DEPLOY_HOST:/opt/tsa/"
    - scp -r backend/migrations "$DEPLOY_HOST:/opt/tsa/backend/"
    - scp scripts/apply_migrations.sh "$DEPLOY_HOST:/opt/tsa/scripts/"
    # 2) Data plane up → migrations → app rollout (healthcheck-gated).
    - |
      ssh "$DEPLOY_HOST" "
        set -e
        cd /opt/tsa
        sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env
        docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' '$CI_REGISTRY'
        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait cassandra redis influxdb grafana
        bash scripts/apply_migrations.sh
        docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app pull
        docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --wait
        docker image prune -f
      "

deploy:staging:
  extends: .deploy-template
  environment:
    name: staging
    url: https://staging.example.com   # replace with the real staging domain
  variables:
    DEPLOY_HOST: $DO_STAGING_HOST
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:production:
  extends: .deploy-template
  environment:
    name: production
    url: https://app.example.com       # replace with the real production domain
  variables:
    DEPLOY_HOST: $DO_PRODUCTION_HOST
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual                      # explicit human gate for production
