# Stage: build — container images via kaniko (no privileged docker-in-docker).
# Images: $CI_REGISTRY_IMAGE/{backend,worker,frontend}:{$CI_COMMIT_SHORT_SHA | vX.Y.Z}

.build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}"
      > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR/$BUILD_CONTEXT"
      --dockerfile "$CI_PROJECT_DIR/$BUILD_CONTEXT/Dockerfile"
      $KANIKO_TARGET
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      ${CI_COMMIT_TAG:+--destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_TAG"}
      --cache=true

build:backend-image:
  extends: .build-image
  variables:
    BUILD_CONTEXT: backend
    IMAGE_NAME: backend
    KANIKO_TARGET: "--target api"

build:worker-image:
  extends: .build-image
  variables:
    BUILD_CONTEXT: backend
    IMAGE_NAME: worker
    KANIKO_TARGET: "--target worker"   # + Prophet/pandas for forecast bands

build:frontend-image:
  extends: .build-image
  variables:
    BUILD_CONTEXT: frontend
    IMAGE_NAME: frontend
    KANIKO_TARGET: ""
