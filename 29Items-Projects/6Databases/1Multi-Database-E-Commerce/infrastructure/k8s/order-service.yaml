# Representative service manifest. Every microservice follows this template:
# Deployment (>=2 replicas, probes, resources, non-secret config + secret refs),
# a ClusterIP Service, and an HPA. Secrets come from External Secrets Operator.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shopflow
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service   # IRSA-annotated for AWS access
      containers:
        - name: order-service
          image: ${ECR_REGISTRY}/shopflow/order-service:${IMAGE_TAG}
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secrets   # synced from AWS Secrets Manager
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopflow
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 8083
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: shopflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
  namespace: shopflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
