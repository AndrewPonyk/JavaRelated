server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 1024

spring:
  application:
    name: auth-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change-me-redis}

# Stand-alone dev convenience: relax the default Spring Security chain so the
# auth endpoints are reachable. Real rules are enforced at the gateway.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.shopflow: INFO
