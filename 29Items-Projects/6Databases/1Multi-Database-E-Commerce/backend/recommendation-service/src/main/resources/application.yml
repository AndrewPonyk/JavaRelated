server:
  port: 8085
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
    min-response-size: 1024

spring:
  application:
    name: recommendation-service
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:change-me-neo4j}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: recommendation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Two event types (order.events, product.events); dispatch by the
        # producer's __TypeId__ header rather than a single default type.
        spring.json.trusted.packages: com.shopflow.common.event

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.shopflow: INFO
