# =====================================================================
# Local polyglot stack for ShopFlow.  Spins up every datastore + Kafka.
# Application services are built from their own Dockerfiles (profiles:
# "apps") so the default `docker compose up -d` brings up infra only.
#
#   docker compose up -d                 # infra only
#   docker compose --profile apps up -d  # infra + microservices
# =====================================================================
name: shopflow

services:
  # ---------------- Oracle (transactional core) ----------------
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-change-me-oracle}
      APP_USER: ${ORACLE_USER:-shopflow}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-change-me-oracle}
    ports: ["1521:1521"]
    volumes: ["oracle-data:/opt/oracle/oradata"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  # ---------------- MongoDB (catalog) ----------------
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-shopflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-change-me-mongo}
      MONGO_INITDB_DATABASE: catalog
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./backend/catalog-service/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s   # don't count failures during init-script restart window

  # ---------------- Redis (sessions / cache) ----------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-redis}"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Elasticsearch (search) ----------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15

  # ---------------- Neo4j (recommendations) ----------------
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me-neo4j}
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data"]

  # ---------------- Kafka (event backbone, KRaft mode) ----------------
  # Official Apache image (KRaft-native). Dual listeners: EXTERNAL for host
  # tooling (localhost:9092), INTERNAL for in-network containers (kafka:29092).
  kafka:
    image: apache/kafka:3.7.2
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["9092:9092"]

  # ================= Application services (profile: apps) =================
  # `docker compose --profile apps up -d --build` builds + runs the full stack.
  # All connect to the in-network datastore hostnames and Kafka's INTERNAL
  # listener (kafka:29092).

  api-gateway:
    build: { context: ./backend, dockerfile: api-gateway/Dockerfile }
    profiles: ["apps"]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      JWT_SECRET: ${JWT_SECRET:-change-me-with-a-256-bit-secret-value-please}
      AUTH_URI: http://auth-service:8081
      CATALOG_URI: http://catalog-service:8082
      ORDER_URI: http://order-service:8083
      SEARCH_URI: http://search-service:8084
      RECO_URI: http://recommendation-service:8085
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]

  auth-service:
    build: { context: ./backend, dockerfile: auth-service/Dockerfile }
    profiles: ["apps"]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      JWT_SECRET: ${JWT_SECRET:-change-me-with-a-256-bit-secret-value-please}
    ports: ["8081:8081"]

  catalog-service:
    build: { context: ./backend, dockerfile: catalog-service/Dockerfile }
    profiles: ["apps"]
    depends_on:
      mongodb: { condition: service_healthy }
      kafka:   { condition: service_started }
    environment:
      MONGODB_URI: mongodb://${MONGODB_USER:-shopflow}:${MONGODB_PASSWORD:-change-me-mongo}@mongodb:27017/catalog?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8082:8082"]

  order-service:
    build: { context: ./backend, dockerfile: order-service/Dockerfile }
    profiles: ["apps"]
    depends_on:
      oracle: { condition: service_healthy }
      kafka:  { condition: service_started }
    environment:
      ORACLE_JDBC_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      ORACLE_USER: ${ORACLE_USER:-shopflow}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-change-me-oracle}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8083:8083"]

  search-service:
    build: { context: ./backend, dockerfile: search-service/Dockerfile }
    profiles: ["apps"]
    depends_on:
      elasticsearch: { condition: service_healthy }
      kafka:         { condition: service_started }
    environment:
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8084:8084"]

  recommendation-service:
    build: { context: ./backend, dockerfile: recommendation-service/Dockerfile }
    profiles: ["apps"]
    depends_on:
      neo4j: { condition: service_started }
      kafka: { condition: service_started }
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8085:8085"]

  realtime-service:
    build: { context: ./backend, dockerfile: realtime-service/Dockerfile }
    profiles: ["apps"]
    depends_on:
      kafka: { condition: service_started }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8086:8086"]

  ml-service:
    build: ./ml-service
    profiles: ["apps"]
    depends_on:
      kafka: { condition: service_started }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ML_KAFKA_ENABLED: "true"
      ML_MODEL_NAME: ${ML_MODEL_NAME:-distilbert-base-uncased-finetuned-sst-2-english}
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    profiles: ["apps"]
    depends_on:
      api-gateway: { condition: service_started }
    ports: ["3000:3000"]

volumes:
  oracle-data:
  mongo-data:
  redis-data:
  es-data:
  neo4j-data:
  # kafka: ephemeral log dir (avoids non-root named-volume perms); dev-only
