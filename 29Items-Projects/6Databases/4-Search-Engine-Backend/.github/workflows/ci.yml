name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, typecheck, tests (70% coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy app
      - name: Unit + API tests with coverage
        run: >
          pytest tests -m "not integration" -q
          --cov=app --cov-report=term --cov-fail-under=70

  backend-integration:
    name: Backend — full-stack integration (real ES/PG/Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RUN_INTEGRATION: "1"
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: search
          POSTGRES_PASSWORD: search
          POSTGRES_DB: search
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U search" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # Migrations + index bootstrap run inside the suite's session fixture.
      - name: Full-stack integration tests
        run: pytest tests -m integration -q
      # Phase-2 backlog (docs/PROJECT-PLAN.md): relevance regression suite
      # (golden queries + nDCG@10 gate) lands in this job once judgments exist.

  frontend:
    name: Frontend — lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Typecheck + build
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t search-api:${{ github.sha }} backend
      - name: Build frontend image
        run: docker build -t search-web:${{ github.sha }} frontend
      # Images are pushed only by the deploy workflows (deploys promote built images).
