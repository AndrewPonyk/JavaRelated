# ===========================================================================
# CI -- build, lint, test, and prove the pipeline actually runs.
#
# Design notes, because a CI file is a design document people skip:
#
#  * NO DOCKER anywhere. The project runs locally on a JDK and nothing else
#    (see docs/TECH-NOTES.md 3.1). A container here would test the container.
#
#  * The matrix is over OPERATING SYSTEMS, not JDK versions. This code is
#    almost entirely about thread scheduling, and Linux, Windows and macOS
#    schedule differently -- a race that never appears on ubuntu shows up on
#    windows within a handful of runs. A JDK matrix would re-test the same
#    scheduler three times; `maven.compiler.release=21` already pins the
#    language level.
#
#  * The smoke job is not redundant with the tests. Unit tests exercise the
#    stages; the smoke job exercises `main` -- config loading, the object
#    graph, the shutdown hook, the exit code. Almost every wiring bug this
#    project can have is invisible to the tests and obvious here.
#
#  * Nothing in this file is allowed to depend on wall-clock timing beyond the
#    pipeline's own timeouts. A CI runner is a shared, oversubscribed machine;
#    an assertion of the form "this finishes in under 2 seconds" is a
#    guaranteed future flake.
# ===========================================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Manual trigger: the soak job below is expensive and sometimes wanted on
  # demand, not only on a schedule.
  workflow_dispatch:
    inputs:
      run_soak:
        description: 'Run the long soak job'
        type: boolean
        default: false

# A second push to the same branch makes the first run's result irrelevant.
# Cancelling it frees a runner instead of burning minutes on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # -B batch mode (no ANSI cruft in the log), -ntp no transfer progress
  # (thousands of download lines otherwise). Not -q: a CI log that hides the
  # build output is a CI log you cannot diagnose.
  MAVEN_ARGS: -B -ntp

jobs:
  # -------------------------------------------------------------------------
  # Lint and static analysis, alone and first.
  #
  # Split from `test` deliberately: Checkstyle finishes in seconds, and a
  # style violation should not wait behind a three-minute test matrix on three
  # operating systems. It also fails fast on the most common PR problem.
  # -------------------------------------------------------------------------
  lint:
    name: Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # checkstyle:check alone, not `mvn validate`: the goal is bound to the
      # validate phase in pom.xml, so running the phase would also resolve
      # test dependencies this job does not need.
      - name: Checkstyle
        run: mvn $MAVEN_ARGS checkstyle:check

  # -------------------------------------------------------------------------
  # Tests on three schedulers.
  # -------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # false, emphatically. A failure on windows-latest is information about
      # windows-latest; cancelling the ubuntu run that was about to pass
      # destroys the comparison that makes the failure diagnosable.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify`, not `test`: verify runs the JaCoCo report execution bound to
      # that phase, so coverage is produced by the same command that gates the
      # build rather than by a second, separately-configurable one.
      - name: Build, test and cover
        run: mvn $MAVEN_ARGS verify
        shell: bash

      # if: always() -- the reports are most valuable precisely when the step
      # above failed, which is when a bare `uses:` would be skipped.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # Smoke: does the assembled artifact actually run?
  #
  # This is the job that catches the failures unit tests structurally cannot:
  # a missing resource on the classpath, a broken manifest, a shutdown hook
  # that deadlocks, an exit code that does not match the contract.
  # -------------------------------------------------------------------------
  smoke:
    name: Smoke run
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package
        run: mvn $MAVEN_ARGS -DskipTests package

      - name: Resolve the jar
        id: jar
        run: echo "path=$(ls target/event-processing-pipeline-*.jar)" >> "$GITHUB_OUTPUT"

      # 1. The happy path. Dashboard off: its output is for a human watching a
      #    terminal, and 500 refresh lines in a CI log obscure the report.
      #    --pipeline.output.dir is pinned rather than inherited, because the
      #    default `dev` profile writes to ./output/dev and the assertion two
      #    steps down would then silently depend on which profile loaded.
      #
      #    `shell: bash` is load-bearing, not decoration. The default shell for
      #    a `run:` step is `bash -e`, which does NOT set pipefail, so the exit
      #    code of `java | tee` is tee's -- always 0. This step's whole claim is
      #    "expect exit 0"; without pipefail it asserts nothing.
      - name: Run the pipeline (expect exit 0)
        shell: bash
        run: |
          java -jar "${{ steps.jar.outputs.path }}" \
            --pipeline.event.count=200000 \
            --pipeline.events.per.second=0 \
            --pipeline.consumer.threads=4 \
            --pipeline.queue.capacity=16 \
            --pipeline.dashboard.enabled=false \
            --pipeline.output.dir=./output/ci \
            --pipeline.log.level=INFO \
            | tee run.log

      # The exit code above already gates this, but the exit code is computed
      # by the same code as the reconciliation. Asserting on the printed line
      # independently is what turns "the code agrees with itself" into
      # "the counters actually balance".
      - name: Assert the counters reconciled
        run: |
          grep -q 'reconciled=true' run.log || {
            echo '::error::counters did not reconcile'; tail -n 30 run.log; exit 1; }
          grep -q '^result : OK' run.log || {
            echo '::error::report did not say OK'; tail -n 30 run.log; exit 1; }

      # 2. Invalid configuration must exit 2, not 1. A CI system may retry a
      #    flaky run; it must never retry a bad config, and the two are
      #    indistinguishable if both exit 1.
      - name: Reject an unknown setting (expect exit 2)
        run: |
          set +e
          java -jar "${{ steps.jar.outputs.path }}" --pipeline.consumer.thread=8 >config.log 2>&1
          code=$?
          set -e
          echo "exit=$code"
          [ "$code" -eq 2 ] || { echo '::error::expected exit 2'; cat config.log; exit 1; }
          grep -q 'configuration error' config.log || { cat config.log; exit 1; }

      # 3. A config that cannot terminate must also be rejected before start.
      - name: Reject an unstoppable producer (expect exit 2)
        run: |
          set +e
          java -jar "${{ steps.jar.outputs.path }}" \
            --pipeline.event.count=0 --pipeline.duration.seconds=0 >unstoppable.log 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo '::error::expected exit 2'; cat unstoppable.log; exit 1; }

      # 4. --help must work and must exit 0. It is the only documentation an
      #    operator has at 3 a.m., and it is the first thing to rot silently.
      - name: Help text (expect exit 0)
        shell: bash          # pipefail again: `java --help | tee` would hide a crash
        run: |
          java -jar "${{ steps.jar.outputs.path }}" --help | tee help.log
          grep -q 'pipeline.queue.capacity' help.log || { echo '::error::help is stale'; exit 1; }

      # 5. Ctrl+C must drain, print a report and exit 130. This is the least
      #    exercised path in the whole application and the one most likely to
      #    lose events, so CI covers it on every push.
      - name: Graceful SIGINT (expect exit 130 and a report)
        run: |
          java -jar "${{ steps.jar.outputs.path }}" \
            --pipeline.event.count=0 \
            --pipeline.duration.seconds=60 \
            --pipeline.events.per.second=0 \
            --pipeline.dashboard.enabled=false \
            --pipeline.shutdown.timeout.seconds=10 >sigint.log 2>&1 &
          pid=$!
          # Long enough for the producer to be well into a batch and for both
          # queues to be at capacity -- interrupting an idle pipeline proves
          # nothing about draining a busy one.
          sleep 5
          kill -INT $pid
          set +e
          wait $pid
          code=$?
          set -e
          echo "exit=$code"
          [ "$code" -eq 130 ] || { echo "::error::expected 130, got $code"; tail -n 40 sigint.log; exit 1; }
          grep -q '=== Pipeline report ===' sigint.log || {
            echo '::error::interrupted run printed no report'; tail -n 40 sigint.log; exit 1; }
          grep -q 'reconciled=true' sigint.log || {
            echo '::error::interrupted run lost events'; tail -n 40 sigint.log; exit 1; }

      # 6. The CSV sink actually wrote something parseable.
      - name: Assert the CSV report exists
        run: |
          test -s output/ci/aggregates.csv || { echo '::error::no CSV written'; ls -R output || true; exit 1; }
          head -n 3 output/ci/aggregates.csv

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            *.log
            output/
          retention-days: 7
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # Soak: many short runs with varying seeds, plus injected interrupts.
  #
  # Not on every push -- it costs minutes and its value is statistical, so it
  # runs on demand. A concurrency bug that reproduces once in fifty runs is
  # invisible to every other job in this file.
  # -------------------------------------------------------------------------
  soak:
    name: Soak
    if: github.event_name == 'workflow_dispatch' && inputs.run_soak
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package
        run: mvn $MAVEN_ARGS -DskipTests package

      # Short iterations, many of them, with an interrupt every fifth. The
      # duration is per iteration; total wall clock is bounded by the
      # timeout-minutes above rather than by hope.
      - name: Soak
        run: bash scripts/soak.sh --iterations 30 --duration 10 --interrupt-every 5

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: target/soak/
          retention-days: 14
          if-no-files-found: warn
