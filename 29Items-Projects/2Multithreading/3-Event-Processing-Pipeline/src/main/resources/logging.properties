# ---------------------------------------------------------------------------
# java.util.logging configuration, read from the classpath by
# com.example.pipeline.presentation.cli.LoggingSupport.
#
# Override without rebuilding:
#   java -Djava.util.logging.config.file=my-logging.properties -jar ...
# LoggingSupport honours that system property and leaves this file untouched.
# ---------------------------------------------------------------------------

# Console only. No FileHandler: a pipeline run is a foreground process whose
# output belongs to whoever launched it, and a rotating log file appearing in
# the working directory is a surprise nobody asked for. ConsoleHandler writes
# to stderr, which is what keeps stdout clean for the report table and the
# dashboard -- `pipeline > report.txt` still shows diagnostics on the terminal.
handlers = java.util.logging.ConsoleHandler

# Both levels matter. LoggingSupport raises or lowers logger AND handler from
# pipeline.log.level at startup, because a handler left at INFO silently
# discards the FINE records the logger happily published -- the classic JUL
# trap where --pipeline.log.level=FINE appears to do nothing.
.level = INFO
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.encoding = UTF-8

# Thread name in every line is the point of a custom formatter. SimpleFormatter
# cannot do it: a LogRecord carries a thread id, not a name, so no pattern can
# print `pipeline-filter-2`. See PipelineLogFormatter for the details.
#
# Threads you will see: pipeline-producer-N, pipeline-filter-N,
# pipeline-aggregator-N, pipeline-fj-N, pipeline-dashboard-N, pipeline-http-N,
# pipeline-shutdown, main.
java.util.logging.ConsoleHandler.formatter = com.example.pipeline.presentation.cli.PipelineLogFormatter

# Per-package levels. Uncomment one line to make a single area verbose without
# drowning in the rest -- far more useful than a global FINE.
#com.example.pipeline.application.stage.level = FINE
#com.example.pipeline.infrastructure.queue.level = FINE
#com.example.pipeline.infrastructure.http.level = FINE

# The JDK HTTP server logs per-request detail that turns a polling dashboard
# client into noise. WARNING keeps the failures and drops the rest.
com.sun.net.httpserver.level = WARNING
sun.net.www.protocol.http.level = WARNING
