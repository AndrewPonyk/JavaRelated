# ===========================================================================
# Committed baseline configuration.
#
# Precedence, lowest wins first (see ConfigLoader):
#   1. defaults compiled into PipelineConfig.Builder
#   2. THIS FILE, from the classpath
#   3. config/application-<env>.properties on disk
#   4. environment variables -- PIPELINE_QUEUE_CAPACITY style
#   5. CLI flags -- --pipeline.queue.capacity=128, which always win
#
# Every key below is validated at startup. An unknown key is a hard error
# (exit 2), not a warning: a silently ignored `pipeline.consumer.thread` typo
# is a bug that only shows up as odd throughput hours later.
#
# NO SECRETS IN THIS FILE. It is committed and packaged into the jar. Tokens
# and passwords come from the environment -- PIPELINE_HTTP_TOKEN,
# PIPELINE_JDBC_PASSWORD. See docs/TECH-NOTES.md section 3.4.
# ===========================================================================

# --- profile ---------------------------------------------------------------
# Selects config/application-<env>.properties. Overridden by PIPELINE_ENV or
# --pipeline.env=prod. Kept as `dev` so a plain `mvn exec:java` is safe.
pipeline.env = dev

# --- workload --------------------------------------------------------------
# The producer stops at whichever of these two comes first. At least one must
# be non-zero, otherwise it never stops and no poison pill is ever emitted.
# 0 means "no limit from this side".
pipeline.event.count = 100000
pipeline.duration.seconds = 0

# Target emission rate, enforced by a token bucket over System.nanoTime().
# 0 means unthrottled -- useful for a throughput measurement, misleading for a
# backpressure demonstration, because an unthrottled producer simply pins the
# raw queue at capacity from the first millisecond.
pipeline.events.per.second = 50000

# Events drained from a queue per batch. This is the central throughput knob:
# larger batches amortise lock acquisition and hand the ForkJoinPool enough
# work to be worth splitting, at the cost of latency and memory per batch.
pipeline.batch.size = 128

# Distinct sensor ids. Also the number of rows in the final aggregate table and
# the number of keys the aggregation stage merges.
pipeline.sensor.count = 16

# Seed for the synthetic generator. Fixed, so two runs with the same settings
# produce byte-identical aggregates -- the property every test here relies on.
pipeline.random.seed = 42

# --- queues and threads ----------------------------------------------------
# Capacity of EACH bounded queue (raw and filtered). Deliberately small: the
# point of the exercise is visible backpressure, and a capacity of 100k would
# turn the queue into an unbounded buffer that hides every timing problem.
pipeline.queue.capacity = 64

# Filter-stage consumer threads. Also the poison-pill count -- the two are
# derived from one another in PipelineConfig so they cannot drift.
pipeline.consumer.threads = 4

# Aggregation ForkJoinPool parallelism. 0 means availableProcessors().
pipeline.aggregation.parallelism = 0

# Below this many events, AggregationTask stops splitting and folds inline.
# Too low and fork/join bookkeeping dominates; too high and the pool idles.
pipeline.sequential.threshold = 512

# --- filtering -------------------------------------------------------------
# Events with a reading strictly above this pass to aggregation. Readings are
# generated in roughly [0, 100], so 50.0 passes about half -- a pass rate near
# 0% or 100% makes the filter stage look broken when it is merely selective.
# Changeable at runtime via POST /threshold when the control plane is enabled.
pipeline.filter.threshold = 50.0

# --- timing ----------------------------------------------------------------
# Total grace period for the drain. 80% is spent on a cooperative shutdown()
# before shutdownNow() interrupts anything still running.
#
# It is NOT a cap on how long a run may take -- that is decided by
# pipeline.event.count and pipeline.duration.seconds. It doubles as the stall
# budget: if no event or batch counter moves for this long, the pipeline is
# wedged and the run is reported as stalled. So raise it for a slow or heavily
# loaded machine, not for a long run.
pipeline.shutdown.timeout.seconds = 30

# How long a stage blocks in poll() before re-checking its stop flag. Must stay
# well below the shutdown timeout, otherwise a stage can sleep through the
# entire grace period in a single poll. This is why take() is not used.
pipeline.poll.timeout.millis = 250

# --- presentation ----------------------------------------------------------
pipeline.dashboard.enabled = true
pipeline.dashboard.interval.millis = 500

# java.util.logging level: SEVERE WARNING INFO CONFIG FINE FINER FINEST.
# FINE logs per-batch detail from every stage; expect thousands of lines.
pipeline.log.level = INFO

# --- control plane (off by default) ----------------------------------------
# When true the pipeline binds an HTTP endpoint on 127.0.0.1 ONLY, and refuses
# to start unless pipeline.http.token is at least 16 characters. Off here
# because a local demo should not open a socket it was not asked to open.
pipeline.http.enabled = false
pipeline.http.port = 8080
# pipeline.http.token intentionally absent -- set PIPELINE_HTTP_TOKEN instead.

# --- persistence -----------------------------------------------------------
# Blank JDBC url selects the in-memory repository. Setting a url opts into the
# JdbcAggregateRepository stub, which throws on save by design -- see
# migrations/README.md for the schema it would write to.
pipeline.jdbc.url =
pipeline.jdbc.user =
# pipeline.jdbc.password intentionally absent -- set PIPELINE_JDBC_PASSWORD.

# Directory for aggregates.csv. Created if missing; relative to the working
# directory, so it lands next to the jar rather than somewhere surprising.
pipeline.output.dir = ./output
