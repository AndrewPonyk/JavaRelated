# ===========================================================================
# Profile: dev  (the default)
#
# Read from disk after the packaged application.properties and before the
# environment. Selected by pipeline.env=dev, PIPELINE_ENV=dev or
# --pipeline.env=dev.
#
# Only overrides belong here. Every key omitted keeps its baseline value from
# src/main/resources/application.properties -- repeating them would create two
# places to change one number.
#
# Goal of this profile: a run that finishes in about a second, prints a
# readable dashboard, and shows backpressure rather than raw throughput.
# ===========================================================================

# Small and fast. A dev run that takes 30 seconds stops being run.
pipeline.event.count = 20000

# Throttled well below what the machine can do, so the dashboard shows a
# steady rate instead of one instant spike followed by a full queue.
pipeline.events.per.second = 10000

# Deliberately tiny. With 4 consumers and 64-event batches this queue reaches
# capacity within a few batches, which is the point: the producer blocks in
# put() and the log shows it. Raise it to hide backpressure entirely.
pipeline.queue.capacity = 16
pipeline.batch.size = 64

# Few sensors, so the final aggregate table fits on one screen.
pipeline.sensor.count = 8

# Fast refresh: the run is short and the display is the deliverable here.
pipeline.dashboard.enabled = true
pipeline.dashboard.interval.millis = 250

# INFO by default even in dev. Switch to FINE per run when you need per-batch
# lines -- `--pipeline.log.level=FINE` -- rather than living at FINE, where the
# useful lines are lost in the noise.
pipeline.log.level = INFO

# Shorter grace period: a dev drain that needs 30 seconds is a bug worth
# hitting, not waiting out.
pipeline.shutdown.timeout.seconds = 10

# Control plane off. Turn it on for one run with:
#   --pipeline.http.enabled=true  and  PIPELINE_HTTP_TOKEN=<32 hex chars>
pipeline.http.enabled = false

pipeline.output.dir = ./output/dev
