# ===========================================================================
# Profile: staging
#
# Selected by --pipeline.env=staging or PIPELINE_ENV=staging.
#
# Goal of this profile: the soak run. Long enough and hot enough to surface
# races, lost events and drain bugs that a one-second dev run never reaches,
# while still being something a CI job can schedule nightly.
#
# Run it with scripts/soak.sh (or scripts/run.ps1 -Env staging).
# ===========================================================================

# Time-bounded rather than count-bounded: a soak is defined by how long it
# runs, and leaving event.count at 0 means the clock is the only stop signal.
pipeline.event.count = 0
pipeline.duration.seconds = 300

# Unthrottled. This is the one profile where saturating the queues is the
# intent -- the producer should spend most of its time blocked in put(), which
# is exactly the state in which a drain bug shows up.
pipeline.events.per.second = 0

# Large batches and a shallow queue: maximum contention per lock acquisition,
# minimum buffering to hide a mistake.
pipeline.batch.size = 256
pipeline.queue.capacity = 32

# More consumers than a typical dev box has cores, on purpose. Oversubscription
# makes the interleavings that only appear under scheduling pressure reachable,
# and the poison-pill count follows this number automatically.
pipeline.consumer.threads = 8

pipeline.sensor.count = 64
pipeline.sequential.threshold = 256

# Threshold near the middle keeps both branches of the filter hot. A threshold
# that passes everything exercises only half the code.
pipeline.filter.threshold = 50.0

# A 300-second run produces 1200 dashboard lines at 250 ms; 5 seconds keeps the
# captured CI log readable while still proving the pipeline is alive.
pipeline.dashboard.enabled = true
pipeline.dashboard.interval.millis = 5000

# WARNING, not INFO: an unattended soak's log is only read when it fails, and
# per-batch INFO lines at this rate would bury the one line that matters.
pipeline.log.level = WARNING

# Generous. A saturated pipeline legitimately needs longer to drain than an
# idle one, and a timeout that fires during a healthy drain reports a failure
# that is not there.
pipeline.shutdown.timeout.seconds = 60
pipeline.poll.timeout.millis = 500

# Control plane on: a soak you cannot inspect while it runs is a soak you have
# to restart to learn anything from. PIPELINE_HTTP_TOKEN must be set in the
# environment -- the run refuses to start otherwise, by design.
pipeline.http.enabled = true
pipeline.http.port = 8081

pipeline.output.dir = ./output/staging
