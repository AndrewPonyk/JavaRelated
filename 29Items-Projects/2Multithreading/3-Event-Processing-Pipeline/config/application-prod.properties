# ===========================================================================
# Profile: prod
#
# Selected by --pipeline.env=prod or PIPELINE_ENV=prod.
#
# Goal of this profile: an unattended batch run whose output is consumed by
# another program. Every setting here answers to that -- machine-readable
# stdout, quiet logs, no interactive display, no open sockets by default.
#
# "prod" for a local console application means "scheduled and unwatched", not
# "a cluster". The distinction that matters is that nobody is looking at the
# terminal, so anything that only makes sense to a human is turned off.
# ===========================================================================

# Sized for a scheduled batch. Overridden per invocation by the scheduler via
# PIPELINE_EVENT_COUNT rather than by editing this file.
pipeline.event.count = 1000000
pipeline.duration.seconds = 0

# Throttled. An unthrottled run on a shared host starves whatever else is on
# it; a known rate makes the run's duration predictable, which is what a
# scheduler needs.
pipeline.events.per.second = 100000

# Tuned for throughput, not for demonstrating backpressure: big batches to
# amortise queue locking, deeper queues to absorb a slow consumer without
# stalling the producer on every hiccup.
pipeline.batch.size = 512
pipeline.queue.capacity = 256

# 0 = availableProcessors(). Explicit numbers are wrong the moment the host
# changes, and this file outlives the host it was written on.
pipeline.consumer.threads = 8
pipeline.aggregation.parallelism = 0
pipeline.sequential.threshold = 1024

pipeline.sensor.count = 256

# --- unattended operation --------------------------------------------------
# Dashboard OFF. Its output is for a human watching a terminal; in a log file
# it is thousands of lines of noise between the start banner and the report.
# The final report still prints, and that is what a consumer parses.
pipeline.dashboard.enabled = false

# WARNING: log only what someone would be paged about. The exit code carries
# success or failure, so INFO lines would be read by nobody.
pipeline.log.level = WARNING

# Longest grace period of the three profiles. A prod run that loses its
# in-flight batches to an impatient timeout has turned a clean shutdown into
# silent data loss -- exit 1 with a lost-event count, when waiting three more
# seconds would have produced exit 0.
pipeline.shutdown.timeout.seconds = 120
pipeline.poll.timeout.millis = 500

# --- control plane ---------------------------------------------------------
# OFF. An unattended run needs no mutation endpoint, and an endpoint that is
# never called is only an attack surface. Enable it deliberately, for one run,
# when you need to inspect something in flight:
#   --pipeline.http.enabled=true --pipeline.http.port=8082
# with PIPELINE_HTTP_TOKEN set in the environment.
pipeline.http.enabled = false

# --- persistence -----------------------------------------------------------
# Left blank on purpose. The JDBC repository is a documented stub that throws
# on save; wiring a real database here would fail every prod run at the last
# step, after all the work was done. See migrations/README.md.
#pipeline.jdbc.url = jdbc:postgresql://localhost:5432/pipeline
#pipeline.jdbc.user = pipeline
# The password never appears in any file -- PIPELINE_JDBC_PASSWORD only.

# Per-profile subdirectory so a prod run cannot overwrite a dev CSV someone is
# still looking at. A scheduled job's working directory is whatever the
# scheduler chose, so set PIPELINE_OUTPUT_DIR to an absolute path there.
pipeline.output.dir = ./output/prod
