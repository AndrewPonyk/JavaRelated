# Parallel Image Processor -- operator configuration.
#
# Read from "config/application.properties" next to the working directory you run the app from
# (see AppConfig.EXTERNAL_FILE). Every key below is commented out at its compiled-in default --
# uncomment and edit only the ones you want to change.
#
# Precedence (highest first): -Dpip.<key> system properties, PIP_* environment variables (see
# .env.example), this file, then the compiled-in defaults shown here. A value set higher up
# always wins over what's in this file.

# --- database / history ---------------------------------------------------

# Whether batch/job history is recorded at all.
# db.enabled=true

# Where the SQLite history database lives. Supports a leading ~ for the home directory.
# db.path=~/.pip/history.db

# --- batch processing -------------------------------------------------------

# Fork/Join worker pool size. 0 (or unset) falls back to the number of available processors.
# batches.parallelism=0

# Below this pixel count, an image is processed as one tile instead of being split further.
# batches.tileThresholdPixels=

# Below this job count, a batch runs as one task instead of being split into sub-batches.
# batches.batchThresholdJobs=

# Images larger than this many pixels are rejected as a decompression-bomb guard.
# batches.maxPixelsPerImage=

# --- output ------------------------------------------------------------------

# Output format for processed images: png, jpg, jpeg, webp, bmp, or gif. Unset keeps the
# source image's own format.
# output.format=

# Output quality for lossy formats, 0.0-1.0.
# output.quality=

# Strip EXIF metadata from output images.
# output.stripMetadata=false

# Overwrite existing files in the output directory instead of failing.
# output.overwriteExisting=false

# --- pipeline ------------------------------------------------------------------

# Default pipeline DSL applied when no --pipeline is given, e.g. "grayscale > resize:800x600".
# pipeline.default=

# --- local control API --------------------------------------------------------

# Whether the local HTTP control API starts (via --serve or --ui). Off unless explicitly enabled.
# api.enabled=false

# Port for the local control API. Always bound to the loopback interface only.
# api.port=8137

# Bearer token required on every endpoint except /health. Leave unset to require no token --
# safe only because the server binds to loopback (see BatchJobController).
# api.token=

# --- retention -----------------------------------------------------------------

# How many days of finished-batch history to keep. 0 means keep it forever (retention purge
# disabled) -- this is the default, not "unset, use the default computed elsewhere".
# retention.days=0

# --- logging -------------------------------------------------------------------

# Log output format: "text" (the JDK's default console formatting) or "json" (one JSON object
# per log record). Any other value falls back to "text".
# log.format=text

# --- ui / locale ---------------------------------------------------------------

# UI/CLI display language, as a BCP 47 tag (e.g. "uk", "en"). Unset or unrecognised falls back
# to English (the bundles' own default), never to the host OS's platform locale.
# ui.locale=
