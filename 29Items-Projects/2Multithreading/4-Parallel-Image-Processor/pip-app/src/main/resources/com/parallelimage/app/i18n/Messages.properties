# Default (English) messages for the CLI. ASCII only -- see CliOptions.usage()'s javadoc for why:
# System.out on Windows encodes with the console codepage rather than file.encoding, so anything
# outside ASCII here would render as '?' in cmd.exe.
cli.usage=Parallel Image Processor - batch image processing on a fork/join pool.\n\nUsage:\n  pip --in DIR --out DIR [\
options]\n  pip --ui                          launch the JavaFX window\n  pip --serve                       start the \
local control API\n\nRequired:\n  -i, --in DIR              source directory\n  -o, --out DIR             destination \
directory (must differ from --in)\n\nProcessing:\n  -p, --pipeline SPEC       operations, '>'-separated; see below\n  \
-f, --format EXT          png | jpg | webp | bmp | gif\n      --quality Q           0.0-1.0, lossy formats only (0.85 \
= 85%)\n      --parallelism N       worker threads (default: available processors)\n  -r, --recursive           descen\
d into subdirectories\n      --overwrite           replace existing output files\n      --strip-metadata      drop EXI\
F from the output\n\nOther:\n      --no-history          do not write to the history database\n      --dry-run        \
\     plan the batch and print it, but write nothing\n  -q, --quiet               print only the final summary\n  -h, \
--help                this text\n  -V, --version             version and runtime information\n\nPipeline grammar (stag\
es separated by '>', arguments by ':'):\n  grayscale                 also accepted as 'greyscale'\n  resize:WxH       \
\         stretch to exactly WxH\n  resize:WxH:fit            scale to fit inside WxH, aspect ratio preserved\n  blur:\
RADIUS               box blur, integer radius 1..64\n  sharpen:AMOUNT            0.0 none, 1.0 standard, up to 5.0\n  \
enhance:MODE[:STRENGTH]   clahe | denoise | super_resolution; 0.0-1.0, default 0.5\n                            (falls\
\ back to a no-op without the OpenCV library)\n\n  Watermarks are not expressible here: their text and overlay path ma\
y contain the\n  '>' and ':' delimiters. Configure them from the UI, which stores each field in its\n  own column of w\
atermark_presets.\n\nExample:\n  pip -i ./photos -o ./web -r -f jpg --quality 0.82 \\\n      -p "resize:1600x1600:fit>\
sharpen:0.3"\n\nExit codes: 0 all jobs succeeded | 1 at least one failed | 2 bad usage | 3 startup failure\n

cli.usageHint=run with --help for usage
cli.error.notADirectory=--in is not a directory: {0}
cli.error.cannotCreateOutput=cannot create --out directory {0}: {1}
cli.noImagesFound=no images found in {0}
cli.noImagesFound.recursiveHint=\ (add --recursive to include subdirectories)
cli.processing.singular=processing {0} image with {1} workers{2}
cli.processing.plural=processing {0} images with {1} workers{2}
cli.processing.historyOff=\ (history off)
cli.processing.pipeline=\  pipeline: {0}
cli.dryRun.header.singular=dry run: {0} job planned, nothing written
cli.dryRun.header.plural=dry run: {0} jobs planned, nothing written
cli.dryRun.line=\  {0} -> {1}
cli.progress.failed=\  FAILED  {0}
cli.summary.line1=processed {0} of {1} in {2}s (avg {3} ms/image, {4} MP total)
cli.summary.line2=\  ok: {0}   failed: {1}   cancelled: {2}
cli.summary.failuresHeader=failures:
cli.summary.failureLine=\  {0}: {1} in {2}: {3}
cli.summary.historyHint=full detail is in the history database; the UI's history pane lists it per job
cli.pipeline.none=(none: format conversion only, to {0})
