# Parallel Image Processor -- packaged default configuration.
#
# This copy is bundled into the jar (AppConfig's CLASSPATH_RESOURCE) and is loaded before the
# operator's own config/application.properties, before PIP_* environment variables, and before
# -Dpip.<key> system properties -- it exists only so a bare "java -jar pip-app.jar" with no
# external file still starts with sensible values. Every key is commented out at its
# compiled-in default; nothing here actually overrides those defaults. Edit the operator-facing
# copy at the repository root (config/application.properties) instead of this one.

# db.enabled=true
# db.path=~/.pip/history.db
# batches.parallelism=0
# batches.tileThresholdPixels=
# batches.batchThresholdJobs=
# batches.maxPixelsPerImage=
# output.format=
# output.quality=
# output.stripMetadata=false
# output.overwriteExisting=false
# pipeline.default=
# api.enabled=false
# api.port=8137
# api.token=
# retention.days=0
