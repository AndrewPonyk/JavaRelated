# Builds pip_enhance (native/) on every supported OS, installs it into
# pip-native's resources exactly where NativeLibraryLoader expects it, and then
# runs the Maven build against a classpath that actually has the native library
# on it -- the only CI context where NativeImageEnhancer is more than dead code.
#
# Also the only place -Xcheck:jni has anything to check: see
# native/README.md "7. CI and -Xcheck:jni" and Risk Register R1 in
# docs/PROJECT-PLAN.md for what it does and does not catch.
name: native-build

on:
  push:
    paths:
      - 'native/**'
      - 'pip-native/**'
      - 'pom.xml'
      - '.github/workflows/native-build.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'pip-native/**'
      - 'pom.xml'
      - '.github/workflows/native-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Each install lands OpenCV somewhere native/cmake/FindOpenCVLocal.cmake
      # already knows to look: libopencv-dev under /usr/lib/*/cmake/opencv4,
      # Homebrew under /opt/homebrew or /usr/local, and the "opencv" Chocolatey
      # package under C:/tools/opencv/build/x64/vc*/lib. No -DOpenCV_DIR needed
      # on any of the three.
      - name: Install OpenCV (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev

      - name: Install OpenCV (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv

      - name: Install OpenCV (Windows)
        if: runner.os == 'Windows'
        run: choco install opencv -y --no-progress

      - name: Regenerate the JNI header
        run: mvn -B -q -pl pip-native -am compile

      - name: Configure native/
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build native/
        run: cmake --build native/build --config Release

      # Installs pip_enhance straight into
      # pip-native/src/main/resources/native/<os>-<arch>/, so every Maven step
      # after this one has it on the classpath via the reactor build.
      - name: Install into pip-native resources
        run: cmake --install native/build --config Release

      # -Xcheck:jni only here: this is the one workflow where a native library
      # is actually loadable, so it is the only place a wrong JNI boundary call
      # has anything to be caught against. See native/README.md "7. CI and
      # -Xcheck:jni" for what this does and does not guard against.
      - name: Build and test with the native library on the classpath
        run: mvn -B -Pquality verify -Dpip.surefire.extraArgs=-Xcheck:jni

      - name: Upload pip_enhance artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip_enhance-${{ runner.os }}
          path: pip-native/src/main/resources/native/**
          if-no-files-found: error
