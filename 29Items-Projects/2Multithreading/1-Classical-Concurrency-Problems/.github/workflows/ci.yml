name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Generate artifact checksum
        if: success()
        run: sha256sum target/classical-concurrency-problems-*.jar > target/SHA256SUMS

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload runnable JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: classical-concurrency-problems
          path: |
            target/classical-concurrency-problems-*.jar
            target/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
