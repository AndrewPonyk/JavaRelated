name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Compile Java
        run: javac java/src/**/*.java -d out/
      - name: Run Java
        run: echo "1" | java -cp out/ Main

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint Python
        run: |
          pip install ruff
          ruff check python/
      - name: Run Python
        run: echo "1" | python python/main.py
