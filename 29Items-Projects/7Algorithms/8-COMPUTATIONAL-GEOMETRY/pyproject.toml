[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-geometry-learning"
version = "0.1.0"
description = "Console-first computational geometry algorithms in Python."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
geometry-demo = "geometry.cli.main:main"

[project.optional-dependencies]
dev = ["coverage>=7.5", "pytest>=8.0", "ruff>=0.4.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.pytest.ini_options]
pythonpath = ["src/python"]
testpaths = ["tests/python"]
addopts = "-p no:cacheprovider -p no:asyncio"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/python/geometry"]

[tool.coverage.report]
fail_under = 70
