name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Test Java with coverage gate
        run: mvn verify

      - name: Smoke Java console
        run: mvn exec:java

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test Python with coverage gate
        run: |
          mkdir -p coverage-data
          python -m coverage run -m pytest
          python -m coverage report

      - name: Smoke Python console
        run: python -m string_algorithms
