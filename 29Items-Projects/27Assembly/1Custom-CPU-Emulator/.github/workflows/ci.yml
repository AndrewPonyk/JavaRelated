name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Stage 1: lint / static style -----------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy
      - name: clang-format (check only)
        run: make format-check
      - name: clang-tidy
        run: make lint || true   # advisory until the codebase is fully clean

  # ---- Stage 2: build + test on a gcc/clang matrix --------------------------
  build-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm libsdl2-dev
      - name: Build (headless core, -Werror)
        run: make core CC=${{ matrix.cc }}
      - name: Build (full, GUI auto-detected)
        run: make CC=${{ matrix.cc }}
      - name: Build with the NASM ALU path
        run: make clean && make CC=${{ matrix.cc }} ASM_ALU=1
      - name: Unit + integration tests
        run: make clean && make test CC=${{ matrix.cc }}
      - name: Assemble guest fixtures
        run: make fixtures
      - name: Self-test the binary
        run: make selftest

  # ---- Stage 3: sanitizers (catch host UB triggered by guest code) ----------
  sanitizers:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Tests under ASan + UBSan
        run: make test OPT="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer"

  # ---- Stage 4: coverage (informational gate on the core) -------------------
  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm lcov
      - name: Tests with coverage instrumentation
        run: make test OPT="-O0 --coverage"
      - name: Collect coverage
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --rc lcov_branch_coverage=1 2>/dev/null || true
          lcov --list coverage.info 2>/dev/null || true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.info
          if-no-files-found: ignore

  # ---- Stage 5: package a release binary on tags ----------------------------
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, sanitizers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm libsdl2-dev
      - name: Build optimized & strip
        run: make OPT="-O2 -DNDEBUG" && strip build/cpuemu
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpuemu-linux-x86_64
          path: build/cpuemu
