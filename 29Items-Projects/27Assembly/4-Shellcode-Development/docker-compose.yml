# docker-compose.yml
# ---------------------------------------------------------------------------
# Brings up the shellcode lab "full stack":
#   lab    -- interactive toolkit container (build / test / develop)
#   target -- the deliberately-vulnerable binary exposed over TCP via socat,
#             so exploit.py can target it remotely (EXPLOIT_MODE=remote).
#
# Usage:
#   docker compose up -d target              # start the vulnerable service
#   docker compose run --rm lab make test    # run the test suite
#   docker compose run --rm lab bash         # interactive lab shell
#
# Exploit the remote target from the lab:
#   docker compose run --rm -e EXPLOIT_MODE=remote \
#       -e TARGET_HOST=target -e TARGET_PORT=1337 lab \
#       python3 src/scripts/exploit.py
# ---------------------------------------------------------------------------
services:
  lab:
    build: .
    image: shellcode-lab
    container_name: shellcode-lab
    stdin_open: true
    tty: true
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp:unconfined]
    command: /bin/bash

  target:
    image: shellcode-lab
    container_name: shellcode-target
    ports:
      - "1337:1337"
    command: ["socat", "TCP-LISTEN:1337,reuseaddr,fork", "EXEC:./bin/vuln,pty,raw,echo=0"]
