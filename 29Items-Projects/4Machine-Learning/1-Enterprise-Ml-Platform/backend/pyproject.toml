[project]
name = "enterprise-ml-platform"
version = "0.1.0"
description = "Centralized ML platform: tracking, registry, serving, A/B, drift, AutoML."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
# ML libs ship incomplete stubs; don't fail the build on third-party typing.
[[tool.mypy.overrides]]
module = ["mlflow.*", "sagemaker.*", "kfp.*", "sklearn.*", "xgboost.*", "tpot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
omit = ["src/api/main.py", "*/migrations/*"]
