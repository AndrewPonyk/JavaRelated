name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · type · test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mluser
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: mlplatform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mluser"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy src
      - name: Security audit
        run: pip-audit -r requirements.txt || true   # report-only for now
      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://mluser:changeme@localhost:5432/mlplatform
        run: pytest

  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t emlp-backend:${{ github.sha }} backend
      - name: Build frontend image
        run: docker build -t emlp-frontend:${{ github.sha }} frontend
      # TODO: trivy scan, then push to ECR on push-to-main only.
