[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-predictor"
version = "0.1.0"
description = "Customer churn prediction with Optuna tuning, SHAP explanations, and retention recommendations."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Data/ML Team" }]
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.36,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<3.0",
    "lightgbm>=4.4,<5.0",
    "catboost>=1.2,<2.0",
    "optuna>=3.6,<4.0",
    "shap>=0.46,<1.0",
    "joblib>=1.4,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------------
# Tooling configuration
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true       # ML libs ship incomplete stubs
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=churn_predictor --cov-report=term-missing"
markers = [
    "slow: long-running tests (model training); excluded from the fast PR lane",
    "integration: tests requiring a live PostgreSQL; self-skip when unavailable",
]

[tool.coverage.run]
source = ["churn_predictor"]
branch = true
