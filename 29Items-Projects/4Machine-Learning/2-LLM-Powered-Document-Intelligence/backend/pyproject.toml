[project]
name = "doc-intelligence-backend"
version = "0.1.0"
description = "LLM-Powered Document Intelligence — RAG backend (FastAPI + LangChain + Bedrock)"
requires-python = ">=3.12"
# Base deps — the default `local` RAG backend needs no cloud SDKs.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",          # multipart uploads
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",                      # async Postgres driver
    "aiosqlite>=0.20",                   # async SQLite (tests / lightweight dev)
    "alembic>=1.13",
    "boto3>=1.34",                        # AWS (S3 storage, SQS queue)
    "pyjwt>=2.8",                         # JWT auth
    "pypdf>=4.2",                         # PDF parsing
    "python-docx>=1.1",                  # DOCX parsing
]

[project.optional-dependencies]
# Production RAG backend (RAG_BACKEND=bedrock). The LangChain stack moves fast — pin in
# production (see TECH-NOTES §3.6).
bedrock = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-aws>=0.2",               # ChatBedrockConverse, BedrockEmbeddings
    "langchain-pinecone>=0.2",
    "langsmith>=0.1",
    "pinecone>=5.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",                       # TestClient transport
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# E501: line length handled by formatter. B008: FastAPI's File()/Form()/Depends()
# default-argument idiom is intentional, not a bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
    # Cosmetic: aiosqlite connections GC'd across event loops during test teardown.
    "ignore:.*non-checked-in connection.*:Warning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
