# Cloud Run service (Knative) spec. Apply with:
#   gcloud run services replace infrastructure/cloudrun-service.yaml --region=$REGION
# Image tag and project are templated by the deploy workflow / envsubst.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: image-classification-service
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 8
      timeoutSeconds: 30
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/AR_REPO/image-classification-service:TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: APP_ENV
              value: production
            - name: MODEL_VERSION
              value: v1
          # Secrets are mounted from Secret Manager (configured out-of-band):
          #   REDIS_URL, DATABASE_URL, JWT_SECRET, API_KEYS
          startupProbe:
            httpGet:
              path: /ready
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 10
