name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -o dist/devopsctl-linux-amd64 ./cmd/devopsctl

      - name: Build Darwin ARM64
        run: GOOS=darwin GOARCH=arm64 go build -o dist/devopsctl-darwin-arm64 ./cmd/devopsctl

      - name: Build Windows AMD64
        run: GOOS=windows GOARCH=amd64 go build -o dist/devopsctl-windows-amd64.exe ./cmd/devopsctl

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Package manager TODO
        run: echo "TODO: update Homebrew tap and APT repository after signing artifacts."
