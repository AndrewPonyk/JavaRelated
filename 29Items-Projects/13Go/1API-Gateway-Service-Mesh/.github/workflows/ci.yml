name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go fmt ./...
      - run: go vet ./...
      - run: go test -cover ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-gateway-backend:${{ github.sha }} ./backend
      - run: docker build -t api-gateway-frontend:${{ github.sha }} ./frontend

  deploy-manifest-check:
    name: deploy-manifest-check
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/api-gateway
