apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: api-gateway
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: api-gateway
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
