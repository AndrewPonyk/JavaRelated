name: Build & push API image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:  # manual rebuilds (e.g. base-image CVE patch)

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # E2E release gate: boot the real image and hit it (TECH-NOTES §3.2).
      - name: Smoke test image
        run: |
          docker run -d --rm -p 8000:8000 -e QF_ENV=dev --name qf-smoke \
            $(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health/live && break || sleep 1
          done
          curl -fs -X POST http://localhost:8000/v1/options/price \
            -H 'Content-Type: application/json' \
            -d '{"spot":100,"strikes":[100],"vol":0.2,"rate":0.05,"expiry":1.0,"kind":"call"}'
          docker stop qf-smoke
