name: Release to PyPI

on:
  push:
    tags: ["v*.*.*"]

jobs:
  verify:
    # Tags never skip gates: full test suite runs before anything is built.
    uses: ./.github/workflows/ci.yml

  build-wheels:
    name: Wheels on ${{ matrix.os }}
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19
        # matrix/skip config lives in [tool.cibuildwheel] in pyproject.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-testpypi:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # Trusted Publishing — no stored token anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from TestPyPI and import
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
                      --extra-index-url https://pypi.org/simple/ quantfinlib
          python -c "import quantfinlib as q; print(q.__version__, q.HAS_NATIVE); \
                     assert q.HAS_NATIVE, 'wheel shipped without the compiled core'"

  publish-pypi:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: pypi   # protected: requires manual reviewer approval
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
