[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "quantfinlib"
version = "0.1.0"
description = "Quantitative finance library: C++ core with Python bindings — options pricing (Black-Scholes, Monte Carlo), risk metrics (VaR/ES), ML volatility-surface fitting."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Quant Team" }]
keywords = ["quantitative-finance", "options", "black-scholes", "monte-carlo", "var", "volatility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "structlog>=24.1",
]
postgres = ["asyncpg>=0.29", "psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/example-org/quantfinlib"
Documentation = "https://example-org.github.io/quantfinlib"
Changelog = "https://github.com/example-org/quantfinlib/blob/main/CHANGELOG.md"

# --- scikit-build-core: builds cpp/ via top-level CMakeLists.txt -------------
[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.24"
wheel.packages = ["python/quantfinlib"]
editable.rebuild = true
build.verbose = true

[tool.scikit-build.cmake.define]
QFCORE_BUILD_TESTS = "OFF"

# --- cibuildwheel -------------------------------------------------------------
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *_ppc64le *_s390x"
test-requires = "pytest"
test-command = "pytest {project}/tests/python -x -q -k 'not slow'"

[tool.cibuildwheel.macos]
archs = ["universal2"]

# --- ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = [
    "E501",             # line length handled by formatter
    "RUF001", "RUF002", "RUF003",  # math notation (σ, ∂, ×) is intentional in docs/comments
]

# --- mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
mypy_path = "python"
packages = ["quantfinlib"]
# scipy and torch ship no (complete) stubs; their imports stay dynamically typed.
ignore_missing_imports = true
warn_unused_ignores = true

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "api"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests (MC convergence, NN training)",
    "integration: tests that spin up the FastAPI app",
]

[tool.coverage.run]
source = ["quantfinlib", "app"]
omit = ["*/_version.py", "*/_qfcore.pyi"]

[tool.coverage.report]
fail_under = 70
show_missing = true
