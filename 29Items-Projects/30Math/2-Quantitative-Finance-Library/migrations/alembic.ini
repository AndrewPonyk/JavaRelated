# Alembic configuration for the quantfinlib API database.
# Run from repo root:  alembic -c migrations/alembic.ini upgrade head

[alembic]
script_location = migrations
prepend_sys_path = api
# URL is taken from QF_DATABASE_URL at runtime (see env.py); this is a fallback.
sqlalchemy.url = sqlite:///./quantfin_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
