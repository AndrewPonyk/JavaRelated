# Local full-stack dev:  docker compose -f docker/docker-compose.yml up
# Database only:         docker compose -f docker/docker-compose.yml up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats # local dev only — real credentials live in secrets
      POSTGRES_DB: stats_dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d stats_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://stats:stats@db:5432/stats_dashboard
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
