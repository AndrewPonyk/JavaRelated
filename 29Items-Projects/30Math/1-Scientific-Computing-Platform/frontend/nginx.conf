# Local/preview serving of the SPA bundle. Production uses CloudFront with
# equivalent behaviors (docs/TECH-NOTES.md §3.3).

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets can cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Security headers (mirror the CloudFront response-headers policy).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
