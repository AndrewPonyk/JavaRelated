[project]
name = "sciengine"
version = "0.1.0"
description = "Scientific kernel for the Scientific Computing Platform: numerical methods, symbolic math (SymPy), plotting, ML featurization. Framework-free by design."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "sympy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
