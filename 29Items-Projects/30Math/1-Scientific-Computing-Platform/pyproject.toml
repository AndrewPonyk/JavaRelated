# Workspace root: one lockfile, one resolver for backend + sciengine, and the
# shared lint/typecheck configuration. This root project is virtual (not a
# package) — the deployables are backend/ and libs/sciengine/.

[project]
name = "scp-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "libs/sciengine"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "nbmake>=1.5",
    "ipykernel>=6.29",
]

# ---------------------------------------------------------------------------
# Shared tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "libs/sciengine/src"]
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is enforced by the formatter
    "RUF002",   # docstrings intentionally use typographic dashes (–, —, ×)
    "RUF003",   # same, in comments
]

[tool.ruff.lint.per-file-ignores]
"libs/sciengine/src/sciengine/symbolic/parsing.py" = ["E741"]  # math symbol names

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true  # sympy/scipy/celery ship incomplete stubs
# Phase 3 roadmap (docs/PROJECT-PLAN.md): ratchet toward strict=true per module.
