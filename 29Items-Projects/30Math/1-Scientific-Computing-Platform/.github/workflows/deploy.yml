# Deploy: images → ECR, migrations, ECS rollout, SPA → S3/CloudFront.
# Auth is GitHub OIDC role assumption — no long-lived AWS keys (docs/ARCHITECTURE.md §2.5).
# Account-specific values come from GitHub *environment variables/secrets*
# (Settings → Environments): AWS_DEPLOY_ROLE_ARN, ECR_REGISTRY, ECS_CLUSTER,
# SPA_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, API_BASE_URL, PRIVATE_SUBNET_IDS,
# ECS_TASKS_SECURITY_GROUP.

name: Deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}  # per-environment secret
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend
        run: |
          docker build -f backend/Dockerfile -t "${{ vars.ECR_REGISTRY }}/scp-backend:${GITHUB_SHA}" .
          docker push "${{ vars.ECR_REGISTRY }}/scp-backend:${GITHUB_SHA}"

  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: One-off migration task (alembic upgrade head)
        # Runs BEFORE the service rollout; migrations are expand→contract
        # compatible one release back (docs/TECH-NOTES.md §3.1).
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --launch-type FARGATE \
            --task-definition scp-migrate \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ vars.ECS_TASKS_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"app","image":"${{ vars.ECR_REGISTRY }}/scp-backend:'"${GITHUB_SHA}"'","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migration task exit code: $EXIT_CODE"
          test "$EXIT_CODE" = "0"

  deploy-backend:
    name: Roll ECS services
    runs-on: ubuntu-latest
    needs: migrate
    environment: ${{ inputs.environment || 'staging' }}
    strategy:
      matrix:
        service: [scp-api, scp-worker]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Register task definition with the new image and roll ${{ matrix.service }}
        # Deployment circuit breaker on the service handles auto-rollback.
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "${{ matrix.service }}" \
            --query 'taskDefinition' > taskdef.json
          jq --arg IMAGE "${{ vars.ECR_REGISTRY }}/scp-backend:${GITHUB_SHA}" \
             '.containerDefinitions[0].image = $IMAGE
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)' \
             taskdef.json > taskdef-new.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ matrix.service }}" --task-definition "$NEW_ARN"
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ matrix.service }}"

  deploy-frontend:
    name: Publish SPA
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build with environment API base URL
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync to S3 + invalidate CloudFront
        run: |
          aws s3 sync dist "s3://${{ vars.SPA_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
