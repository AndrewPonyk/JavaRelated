[project]
name = "scp-backend"
version = "0.1.0"
description = "FastAPI backend + Celery compute workers for the Scientific Computing Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anyio>=4.0",                      # imported directly (to_thread offloading)
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.32",     # asyncio extra pins greenlet on all platforms
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "pyjwt>=2.9",
    "sciengine",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "aiosqlite>=0.20",
]

[tool.uv.sources]
sciengine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# SQLAlchemy's asyncio layer executes ORM code inside greenlets; without this
# the service layer under-reports coverage.
concurrency = ["thread", "greenlet"]
