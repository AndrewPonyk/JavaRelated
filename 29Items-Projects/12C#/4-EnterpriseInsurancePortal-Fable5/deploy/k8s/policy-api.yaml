apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-api
  labels: { app: policy-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: policy-api }
  template:
    metadata:
      labels: { app: policy-api }
    spec:
      containers:
        - name: policy-api
          image: insuranceacr.azurecr.io/policy-api:latest # tag pinned by kustomize in the pipeline
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: portal-config }
            - secretRef: { name: portal-secrets }
          volumeMounts:
            - name: keyvault
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: portal-keyvault
---
apiVersion: v1
kind: Service
metadata:
  name: policy-api
spec:
  selector: { app: policy-api }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policy-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: policy-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: policy-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: policy-api }
