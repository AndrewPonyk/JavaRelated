# Azure Key Vault → k8s secret sync via the CSI Secrets Store driver.
# ${KEYVAULT_NAME} and ${AZURE_TENANT_ID} are substituted by the deploy pipeline
# (envsubst step in .azuredevops/templates/deploy-aks.yml). No secret values live in git.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: portal-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    keyvaultName: "${KEYVAULT_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: policy-db-connection
          objectType: secret
        - |
          objectName: kafka-bootstrap-servers
          objectType: secret
        - |
          objectName: signalr-connection
          objectType: secret
  secretObjects:
    - secretName: portal-secrets
      type: Opaque
      data:
        - objectName: policy-db-connection
          key: ConnectionStrings__PolicyDb
        - objectName: kafka-bootstrap-servers
          key: Kafka__BootstrapServers
        - objectName: signalr-connection
          key: Azure__SignalR__ConnectionString
