apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-portal
  labels: { app: public-portal }
spec:
  replicas: 2
  selector:
    matchLabels: { app: public-portal }
  template:
    metadata:
      labels: { app: public-portal }
    spec:
      containers:
        - name: public-portal
          image: insuranceacr.azurecr.io/public-portal:latest # tag pinned by kustomize in the pipeline
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: public-portal
spec:
  selector: { app: public-portal }
  ports:
    - port: 80
      targetPort: 80
