apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-web
  labels: { app: portal-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: portal-web }
  template:
    metadata:
      labels: { app: portal-web }
    spec:
      # Blazor Server is stateful (circuits) — drain slowly on rollout
      terminationGracePeriodSeconds: 60
      containers:
        - name: portal-web
          image: insuranceacr.azurecr.io/portal-web:latest # tag pinned by kustomize in the pipeline
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: portal-config }
            - secretRef: { name: portal-secrets } # Azure SignalR connection — required for scale-out
          volumeMounts:
            - name: keyvault
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: portal-keyvault
---
apiVersion: v1
kind: Service
metadata:
  name: portal-web
spec:
  selector: { app: portal-web }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portal-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: portal-web }
