# Runs the EF Core migration bundle before each rollout. Deleted and re-applied by
# the pipeline (kubectl delete --ignore-not-found && kubectl apply && kubectl wait).
apiVersion: batch/v1
kind: Job
metadata:
  name: policy-db-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: policy-db-migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: insuranceacr.azurecr.io/policy-db-migrator:latest # tag pinned by kustomize in the pipeline
          command: ["./efbundle"]
          args: ["--connection", "$(ConnectionStrings__PolicyDb)"]
          envFrom:
            - secretRef: { name: portal-secrets }
          volumeMounts:
            - name: keyvault
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: portal-keyvault
