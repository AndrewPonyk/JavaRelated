plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - "db/schema.rb"
    - "vendor/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false

Layout/LineLength:
  Max: 160

Metrics/MethodLength:
  Max: 35

Metrics/AbcSize:
  Max: 45

Metrics/ClassLength:
  Max: 220

Metrics/BlockLength:
  Max: 100
  Exclude:
    - "spec/**/*"
    - "config/routes.rb"

RSpec/ExampleLength:
  Max: 60

RSpec/MultipleExpectations:
  Max: 20

RSpec/DescribeClass:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

Rails/FilePath:
  Enabled: false
