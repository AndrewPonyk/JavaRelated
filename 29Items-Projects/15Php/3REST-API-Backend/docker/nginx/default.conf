server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Security headers (see ARCHITECTURE.md §2.5).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is a no-op over plain HTTP; takes effect once TLS terminates here
    # (or is set at the load balancer/ingress in production).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12M;

    # gzip for JSON/text responses.
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;            # php-fpm service
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60;
    }

    # Deny access to hidden/sensitive files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
