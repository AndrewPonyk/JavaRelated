; Production PHP tuning for the Laravel API container.

memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
expose_php = Off

; ── OPcache (compile PHP once, serve from memory) ─────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; In production we never invalidate on file change — deploys ship a new image.
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Preload the framework for an extra throughput bump (optional).
; opcache.preload = /var/www/html/preload.php
; opcache.preload_user = www-data
