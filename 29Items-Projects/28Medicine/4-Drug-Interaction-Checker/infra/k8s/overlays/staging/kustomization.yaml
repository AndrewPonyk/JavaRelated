apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-

patches:
  - target: { kind: Deployment, name: backend }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }

configMapGenerator:
  - name: dic-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging

images:
  - name: ghcr.io/OWNER/dic-backend
    newTag: staging
  - name: ghcr.io/OWNER/dic-frontend
    newTag: staging
