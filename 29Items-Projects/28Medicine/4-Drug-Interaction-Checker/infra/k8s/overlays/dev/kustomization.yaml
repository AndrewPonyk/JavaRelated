apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-

# Single replica per workload in dev to save cost.
patches:
  - target: { kind: Deployment, name: backend }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: ml-severity }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: frontend }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }

configMapGenerator:
  - name: dic-config
    behavior: merge
    literals:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG

images:
  - name: ghcr.io/OWNER/dic-backend
    newTag: dev
  - name: ghcr.io/OWNER/dic-frontend
    newTag: dev
