apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-

patches:
  - target: { kind: Deployment, name: backend }
    patch: |
      - { op: replace, path: /spec/replicas, value: 3 }
  - target: { kind: Deployment, name: ml-severity }
    patch: |
      - { op: replace, path: /spec/replicas, value: 3 }
  - target: { kind: Deployment, name: frontend }
    patch: |
      - { op: replace, path: /spec/replicas, value: 3 }

configMapGenerator:
  - name: dic-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

# Prod pins immutable, validated tags (set by the deploy workflow to a digest/SHA).
images:
  - name: ghcr.io/OWNER/dic-backend
    newTag: stable
  - name: ghcr.io/OWNER/dic-frontend
    newTag: stable
