apiVersion: v1
kind: Service
metadata:
  name: ml-severity
  labels:
    app: ml-severity
spec:
  selector:
    app: ml-severity
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-severity
