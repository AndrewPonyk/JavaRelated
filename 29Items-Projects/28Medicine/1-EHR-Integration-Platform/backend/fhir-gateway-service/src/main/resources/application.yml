server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: fhir-gateway-service

  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/XE}
    username: ${ORACLE_USERNAME:ehr_app}
    password: ${ORACLE_PASSWORD:changeit}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate            # schema owned by Flyway, never auto-generated
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
      hibernate.jdbc.batch_size: 50
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.ehrplatform: DEBUG
  pattern:
    console: "%d{ISO8601} %-5level [%X{traceId}] %logger{36} - %msg%n"

# Application-specific knobs
ehr:
  fhir:
    base-url: ${FHIR_BASE_URL:http://localhost:8081/fhir}
  outbox:
    enabled: true
    relay-interval-ms: 2000
