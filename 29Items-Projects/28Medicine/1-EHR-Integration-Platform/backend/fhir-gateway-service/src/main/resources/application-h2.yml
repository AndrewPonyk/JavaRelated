# Dev/demo profile: in-memory H2 instead of Oracle (no DB container needed).
# Activate with SPRING_PROFILES_ACTIVE=dev,h2 — handy for a fast local stack.
spring:
  datasource:
    url: jdbc:h2:mem:ehr;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop          # schema from JPA entities (Flyway is Oracle-only)
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
