apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-gateway-service
  namespace: ehr-platform
  labels:
    app.kubernetes.io/name: fhir-gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fhir-gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fhir-gateway-service
    spec:
      serviceAccountName: fhir-gateway   # IRSA-bound (P1-4)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fhir-gateway-service
          image: ECR_REGISTRY/ehr/fhir-gateway-service:latest  # overwritten by CD per SHA
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: fhir-gateway-secrets    # synced by External Secrets Operator
            - configMapRef:
                name: fhir-gateway-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fhir-gateway-service
  namespace: ehr-platform
spec:
  selector:
    app.kubernetes.io/name: fhir-gateway-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fhir-gateway-service
  namespace: ehr-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fhir-gateway-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
