# nginx config for serving the SPA + proxying API/FHIR to the backend services.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense in depth; CSP also set in index.html).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Risk stratification + entity linking → entity-linking service.
    location ~ ^/api/v1/(stratification|link) {
        proxy_pass http://entity-linking-service:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # FHIR + patient admin → gateway.
    location ~ ^/(fhir|api)/ {
        proxy_pass http://fhir-gateway-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
