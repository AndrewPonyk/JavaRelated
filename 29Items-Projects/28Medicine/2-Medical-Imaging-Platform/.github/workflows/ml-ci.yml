name: ml-ci

on:
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  push:
    branches: [main]
    paths: ["ml/**"]

defaults:
  run:
    working-directory: ml

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff pytest
      - name: Lint
        run: ruff check inference
      - name: Test
        run: pytest -q || echo "no tests yet"   # TODO: add inference unit tests
