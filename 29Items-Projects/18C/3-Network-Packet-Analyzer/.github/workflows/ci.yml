name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.cc }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        mode: [release, sanitize]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcap-dev libncursesw5-dev

      - name: Build (release)
        if: matrix.mode == 'release'
        run: make STRICT=1

      - name: Build (sanitizers)
        if: matrix.mode == 'sanitize'
        run: make STRICT=1 ASAN=1

      - name: Unit tests
        run: make test ${{ matrix.mode == 'sanitize' && 'ASAN=1' || '' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

      - name: Headless smoke test (real pcap → JSON)
        if: matrix.mode == 'release'
        run: |
          make fixtures
          ./build/bin/npa -r tests/fixtures/sample.pcap --headless --json | tee /tmp/npa.json
          grep -q '"type":"summary"' /tmp/npa.json
          grep -q '"rule":"port-scan"' /tmp/npa.json
          grep -q '"rule":"tcp-xmas-scan"' /tmp/npa.json
          echo "smoke OK"

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    # Style/static-analysis findings are surfaced but do not gate the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck \
            libpcap-dev libncursesw5-dev
      - name: clang-format (check)
        run: ./scripts/format.sh --check
      - name: Static analysis
        run: ./scripts/lint.sh
