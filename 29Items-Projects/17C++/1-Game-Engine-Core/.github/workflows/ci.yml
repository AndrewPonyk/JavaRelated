name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Lint (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting (advisory)
        continue-on-error: true
        run: |
          find engine runtime editor tests benchmarks \
            \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-clang,  os: ubuntu-24.04,  cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-2022,  cc: cl,    cxx: cl }
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Enable MSVC dev shell (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The default build is dependency-free: engine core + all CPU subsystems +
      # the full GoogleTest-compatible suite, with the GPU/audio/Lua/ONNX/SQLite
      # backends disabled. No package manager required.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DENGINE_BUILD_TESTS=ON
          -DENGINE_BUILD_EDITOR=ON
          -DENGINE_ENABLE_VULKAN=OFF
          -DENGINE_ENABLE_OPENGL=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (headless runtime)
        run: ./build/bin/GameEngineCore --smoke-test
        shell: bash

  sanitizers:
    name: Sanitizers (ASan/UBSan, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (sanitizers on)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DENGINE_BUILD_TESTS=ON
          -DENGINE_ENABLE_SANITIZERS=ON
          -DENGINE_ENABLE_VULKAN=OFF -DENGINE_ENABLE_OPENGL=OFF
      - name: Build
        run: cmake --build build
      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
