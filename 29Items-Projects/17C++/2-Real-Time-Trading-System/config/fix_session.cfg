# ============================================================================
#  config/fix_session.cfg
#  QuickFIX-style session settings (used by the integration-test acceptor and
#  as a reference for the native engine session parameters).
# ============================================================================
[DEFAULT]
ConnectionType=initiator
ReconnectInterval=5
FileStorePath=var/fix/store
FileLogPath=var/fix/log
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=config/FIX44.xml
ValidateUserDefinedFields=N
ResetOnLogon=Y
HeartBtInt=30

[SESSION]
BeginString=FIX.4.4
SenderCompID=TRADER1
TargetCompID=EXCHANGE
SocketConnectHost=127.0.0.1
SocketConnectPort=5001
