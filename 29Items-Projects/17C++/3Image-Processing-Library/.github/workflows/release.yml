name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # attach artifacts to the GitHub Release

jobs:
  # ---- Build cross-platform Python wheels --------------------------------
  wheels:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.19
        with:
          package-dir: bindings/python
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-*
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ---- Publish to PyPI + attach to the Release ---------------------------
  publish:
    needs: wheels
    runs-on: ubuntu-24.04
    environment: prod        # gated environment with required reviewers
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # TODO: configure trusted publishing (OIDC) — no token in secrets.
      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
