name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Lint & format (non-blocking style gate) --------------------------
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format (dry-run)
        run: |
          find include src apps bindings tests benchmarks \
            -regex '.*\.\(cpp\|hpp\|cu\)' \
            -not -path '*/third_party/*' \
            | xargs clang-format --dry-run --Werror || \
            echo "::warning::clang-format reported style drift"

  # ---- Build + test matrix (dependency-light default config) -------------
  build-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Enable MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DIMGPROC_BUILD_TESTS=ON
          -DIMGPROC_BUILD_CLI=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---- Optional CUDA compile job (kept green; compile-only) --------------
  build-cuda:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.1'
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (CUDA on)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DIMGPROC_WITH_CUDA=ON
          -DIMGPROC_CUDA_ARCHITECTURES=86
          -DIMGPROC_BUILD_TESTS=OFF
      - name: Build (compile-only; GPU tests run on self-hosted runners)
        run: cmake --build build -j

  # ---- ONNX Runtime backend: build + run REAL inference tests ------------
  onnx:
    needs: build-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure (ONNX on — CMake fetches the ONNX Runtime prebuilt)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DIMGPROC_WITH_ONNX=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (includes real ONNX inference on tests/data/affine.onnx)
        run: ctest --test-dir build --output-on-failure
