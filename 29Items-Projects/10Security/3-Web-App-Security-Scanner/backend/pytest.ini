[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = tests
addopts = --strict-markers --cov=app --cov=ml --cov-report=term-missing --cov-fail-under=70
filterwarnings =
    ignore::DeprecationWarning
markers =
    e2e: tests requiring live ZAP/SQLMap sidecars (run via make test-e2e; use --no-cov)
