# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Differences from dev: production env + private-target guard OFF, no host
# ports on data planes, restart policies, restricted ZAP API addresses,
# replicas + resource caps, TLS-terminating frontend (see frontend/nginx-prod.conf).

services:
  db:
    ports: !override []
    restart: unless-stopped

  migrate:
    restart: "no"
    environment:
      ENV: production

  backend:
    ports: !override []
    restart: unless-stopped
    environment:
      ENV: production
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}  # dev-only convenience off
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }

  zap:
    ports: !override []
    restart: unless-stopped
    # Restrict ZAP API to the backend container only (no wildcard addrs in prod)
    command: "zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=${ZAP_API_KEY} -config api.addrs.addr.name=backend -config api.addrs.addr.regex=false"

  sqlmap:
    ports: !override []
    restart: unless-stopped

  frontend:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro   # fullchain.pem + privkey.pem (gitignored)
    restart: unless-stopped
