# sqlmap defaults mounted read-only into the sqlmap sidecar.
# Principle: TEST for the flaw, don't operate it — conservative risk/level,
# no data exfiltration. Per-scan overrides applied via the REST API client.

# ── Detection depth (orchestrator may raise for the DEEP profile) ──
level = 1
risk = 1

# ── Safety ──
threads = 3
batch = True
# never follow potentially destructive code paths
# (no --dump, no --os-shell, no file writes by default)

# ── Persistence & hygiene ──
# session files live inside the container (ephemeral per task)
flushSession = True

# ── Network politeness ──
delay = 0        # raise (e.g. 1) when scanning fragile production targets
timeout = 30
retries = 3

# ── Reporting ──
verbose = 1

# Authenticated targets: pass cookies/auth headers per task through the
# sqlmap REST API options (see app/services/sqlmap_client.py) — credentials
# never belong in this file.
