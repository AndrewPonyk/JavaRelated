# Local stack with a REAL TLS 1.3 edge (ARCHITECTURE §2.2).
# First run: ./scripts/gen_dev_certs.sh  →  docker compose up --build

services:
  backend:
    build: ./backend
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key}
      DATABASE_URL: sqlite:////app/crypto_toolkit.db
    volumes:
      - db-data:/app/data
    expose: ["5000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    expose: ["80"]

  edge:
    image: nginx:alpine
    depends_on: [frontend, backend]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/tls/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./nginx/tls/server.key:/etc/nginx/tls/server.key:ro

volumes:
  db-data:
