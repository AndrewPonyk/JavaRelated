# Edge nginx — REAL TLS 1.3 endpoint for the demo.
# Certs from scripts/gen_dev_certs.sh (mounted at /etc/nginx/tls/).
# Students verify with:  openssl s_client -connect localhost:443 -tls1_3

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.3;              # 1.3 ONLY — the whole point of the demo
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Vite build is fully external (no inline scripts/styles) so 'self' suffices
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" always;

    # Compress static build assets only. application/json is deliberately NOT
    # compressed: several /api responses reflect user input alongside derived
    # values, and request-controlled plaintext + compression + TLS = BREACH.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;             # app-level cap mirrored (§3.6 #9)
    }
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
