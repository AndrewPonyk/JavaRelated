# SPA static serving + API reverse proxy.
# TLS 1.3 termination happens in the edge nginx (docker-compose), not here —
# this config serves the containerized dev/prod path.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (relaxed for the demo inline styles)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s; # paranoid Argon2 headroom
    }
}
