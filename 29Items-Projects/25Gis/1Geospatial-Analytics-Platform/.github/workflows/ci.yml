name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geospatial
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis -d geospatial"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/geospatial
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Build backend image
        run: docker build -t geospatial-analytics-backend:${{ github.sha }} backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend image
        run: docker build -t geospatial-analytics-frontend:${{ github.sha }} frontend

  deploy-dev:
    name: Deploy Development
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose deployment bundle
        run: docker compose --env-file .env.example config
      - name: Deployment handoff
        run: |
          echo "Images passed CI and compose configuration is valid."
          echo "Wire this step to EC2 deployment credentials in repository secrets."
