services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://travel:travel@db:5432/travel_agency
      PORT: 3000
      CORS_ORIGIN: http://localhost:3000
      ENFORCE_HTTPS: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "3000:3000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel_agency
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_agency"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
