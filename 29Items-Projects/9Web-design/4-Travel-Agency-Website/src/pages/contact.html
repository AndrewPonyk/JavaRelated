<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Northstar Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="/src/assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/index.html">Northstar Travel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/src/pages/destinations.html">Destinations</a></li>
            <li class="nav-item"><a class="nav-link" href="/src/pages/tours.html">Tours</a></li>
            <li class="nav-item"><a class="nav-link" href="/src/pages/about.html">About</a></li>
            <li class="nav-item"><a class="nav-link active" href="/src/pages/contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-5">
            <p class="text-uppercase small fw-semibold text-primary mb-1">Trip inquiry</p>
            <h1 class="h2">Tell us what you want to plan</h1>
            <p class="text-secondary">Share the destination, timing, group size, and budget range. A travel advisor will respond with next steps.</p>
          </div>
          <div class="col-lg-7">
            <form id="inquiryForm" class="contact-form" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="name">Name</label>
                  <input class="form-control" id="name" name="name" autocomplete="name" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="email">Email</label>
                  <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="destination">Destination</label>
                  <input class="form-control" id="destination" name="destination" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="budget">Budget</label>
                  <select class="form-select" id="budget" name="budget">
                    <option value="">Not sure yet</option>
                    <option value="under-3000">Under $3,000</option>
                    <option value="3000-6000">$3,000 to $6,000</option>
                    <option value="6000-plus">$6,000+</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="message">Message</label>
                  <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="consent" name="consent" required>
                    <label class="form-check-label" for="consent">I agree to be contacted about this inquiry.</label>
                  </div>
                </div>
                <div class="col-12">
                  <div id="formStatus" class="form-status" role="status" aria-live="polite"></div>
                  <button class="btn btn-primary" type="submit">
                    <i class="bi bi-send me-1"></i>
                    Send inquiry
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span>&copy; 2026 Northstar Travel</span>
        <a href="/src/pages/tours.html">Browse tours</a>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
    <script src="/src/assets/js/main.js" defer></script>
  </body>
</html>
