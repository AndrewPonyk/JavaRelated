<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tours | Northstar Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="/src/assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/index.html">Northstar Travel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/src/pages/destinations.html">Destinations</a></li>
            <li class="nav-item"><a class="nav-link active" href="/src/pages/tours.html">Tours</a></li>
            <li class="nav-item"><a class="nav-link" href="/src/pages/about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="/src/pages/contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <div class="row align-items-end mb-4">
          <div class="col-lg-7">
            <p class="text-uppercase small fw-semibold text-primary mb-1">Tour finder</p>
            <h1 class="h2">Compare curated travel packages</h1>
          </div>
        </div>

        <div class="row g-3 align-items-end mb-4">
          <div class="col-md-3">
            <label class="form-label" for="regionFilter">Region</label>
            <select class="form-select" id="regionFilter">
              <option value="">All regions</option>
              <option value="europe">Europe</option>
              <option value="asia">Asia</option>
              <option value="americas">Americas</option>
              <option value="africa">Africa</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="difficultyFilter">Difficulty</label>
            <select class="form-select" id="difficultyFilter">
              <option value="">Any difficulty</option>
              <option value="easy">Easy</option>
              <option value="moderate">Moderate</option>
              <option value="active">Active</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="maxPriceFilter">Max price</label>
            <select class="form-select" id="maxPriceFilter">
              <option value="">Any price</option>
              <option value="2500">$2,500</option>
              <option value="4000">$4,000</option>
              <option value="6000">$6,000</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="maxDurationFilter">Max duration</label>
            <select class="form-select" id="maxDurationFilter">
              <option value="">Any duration</option>
              <option value="7">7 days</option>
              <option value="10">10 days</option>
              <option value="14">14 days</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="sortTours">Sort by</label>
            <select class="form-select" id="sortTours">
              <option value="featured">Featured</option>
              <option value="price-asc">Price low to high</option>
              <option value="price-desc">Price high to low</option>
              <option value="duration-asc">Duration shortest</option>
              <option value="duration-desc">Duration longest</option>
            </select>
          </div>
        </div>

        <div id="tourList" class="row g-4" data-tour-list data-source="/api/tours"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span>&copy; 2026 Northstar Travel</span>
        <a href="/src/pages/contact.html">Start an inquiry</a>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
    <script src="/src/assets/js/filters.js" defer></script>
    <script src="/src/components/TourList.js" defer></script>
    <script src="/src/assets/js/main.js" defer></script>
  </body>
</html>
