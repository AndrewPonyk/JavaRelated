[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

[dev]
  publish = "."
  functions = "netlify/functions"
  port = 8888

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/inquiries"
  to = "/.netlify/functions/inquiries"
  status = 200

[[redirects]]
  from = "/api/inquiries/*"
  to = "/.netlify/functions/inquiries/:splat"
  status = 200

[[redirects]]
  from = "/api/tours"
  to = "/.netlify/functions/tours"
  status = 200

[[redirects]]
  from = "/api/tours/*"
  to = "/.netlify/functions/tours/:splat"
  status = 200

[[redirects]]
  from = "/api/destinations"
  to = "/.netlify/functions/destinations"
  status = 200

[[redirects]]
  from = "/api/destinations/*"
  to = "/.netlify/functions/destinations/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/src/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
