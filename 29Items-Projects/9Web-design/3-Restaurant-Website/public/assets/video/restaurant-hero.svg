<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Warm restaurant dining room with tables and ambient lights">
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="0.5" stop-color="#31241b"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      @keyframes glowPulse {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.72; transform: scale(1.05); }
      }
      @keyframes steamRise {
        0% { opacity: 0; transform: translateY(30px) scale(0.9); }
        30% { opacity: 0.38; }
        100% { opacity: 0; transform: translateY(-130px) scale(1.25); }
      }
      @keyframes candleFlicker {
        0%, 100% { opacity: 0.7; transform: scaleY(1); }
        45% { opacity: 1; transform: scaleY(1.22); }
        70% { opacity: 0.55; transform: scaleY(0.86); }
      }
      @keyframes serverMove {
        0%, 100% { transform: translateX(-18px); }
        50% { transform: translateX(18px); }
      }
      .glow { animation: glowPulse 5.8s ease-in-out infinite; transform-origin: center; }
      .glow.two { animation-delay: -1.6s; }
      .glow.three { animation-delay: -3.2s; }
      .steam { animation: steamRise 6s ease-in-out infinite; transform-origin: center; }
      .steam.two { animation-delay: -2s; }
      .steam.three { animation-delay: -4s; }
      .flame { animation: candleFlicker 1.8s ease-in-out infinite; transform-origin: center bottom; }
      .server { animation: serverMove 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect y="665" width="1920" height="415" fill="#120f0c"/>
  <path d="M0 665 C340 610 585 635 850 670 C1120 705 1440 650 1920 610 L1920 1080 L0 1080 Z" fill="#1f1712" opacity="0.9"/>

  <g filter="url(#softBlur)" opacity="0.95">
    <circle class="glow" cx="420" cy="190" r="185" fill="url(#lampGlow)"/>
    <circle class="glow two" cx="970" cy="155" r="215" fill="url(#lampGlow)"/>
    <circle class="glow three" cx="1480" cy="210" r="180" fill="url(#lampGlow)"/>
  </g>

  <g fill="none" stroke="#fef3c7" stroke-width="4" opacity="0.45">
    <path d="M420 0 V170"/>
    <path d="M970 0 V135"/>
    <path d="M1480 0 V190"/>
  </g>
  <g>
    <ellipse cx="420" cy="205" rx="92" ry="34" fill="#451a03"/>
    <ellipse cx="420" cy="198" rx="78" ry="24" fill="#fbbf24" opacity="0.72"/>
    <ellipse cx="970" cy="170" rx="112" ry="38" fill="#451a03"/>
    <ellipse cx="970" cy="162" rx="96" ry="28" fill="#fde68a" opacity="0.68"/>
    <ellipse cx="1480" cy="225" rx="90" ry="32" fill="#451a03"/>
    <ellipse cx="1480" cy="218" rx="76" ry="23" fill="#fbbf24" opacity="0.72"/>
  </g>

  <g opacity="0.82">
    <rect x="265" y="590" width="455" height="32" rx="16" fill="#e7e5e4"/>
    <rect x="315" y="622" width="34" height="210" fill="#78716c"/>
    <rect x="638" y="622" width="34" height="210" fill="#78716c"/>
    <ellipse cx="494" cy="587" rx="82" ry="22" fill="#f59e0b" opacity="0.35"/>
    <circle cx="490" cy="558" r="58" fill="#fafaf9"/>
    <circle cx="490" cy="558" r="32" fill="#92400e"/>
  </g>

  <g opacity="0.92">
    <rect x="960" y="640" width="575" height="36" rx="18" fill="#f5f5f4"/>
    <rect x="1030" y="676" width="38" height="245" fill="#78716c"/>
    <rect x="1420" y="676" width="38" height="245" fill="#78716c"/>
    <circle cx="1238" cy="603" r="72" fill="#fafaf9"/>
    <ellipse cx="1238" cy="603" rx="42" ry="25" fill="#65a30d"/>
    <rect x="1218" y="545" width="12" height="58" rx="6" fill="#fef3c7"/>
    <path class="flame" d="M1224 528 C1210 548 1224 562 1224 562 C1224 562 1238 546 1224 528 Z" fill="#fbbf24"/>
  </g>

  <g class="server" opacity="0.72">
    <circle cx="805" cy="475" r="34" fill="#d6d3d1"/>
    <rect x="772" y="510" width="66" height="145" rx="28" fill="#292524"/>
    <rect x="742" y="558" width="45" height="12" rx="6" fill="#e7e5e4"/>
    <ellipse cx="728" cy="555" rx="62" ry="14" fill="#fafaf9"/>
    <circle cx="708" cy="550" r="16" fill="#f97316"/>
    <circle cx="748" cy="550" r="12" fill="#84cc16"/>
  </g>

  <g fill="none" stroke="#f5f5f4" stroke-width="10" stroke-linecap="round" opacity="0.35">
    <path class="steam" d="M455 520 C420 475 482 455 450 410"/>
    <path class="steam two" d="M500 522 C535 475 480 448 522 398"/>
    <path class="steam three" d="M1260 565 C1218 512 1288 500 1248 448"/>
  </g>

  <g opacity="0.35">
    <rect x="80" y="395" width="220" height="12" rx="6" fill="#fde68a"/>
    <rect x="1560" y="410" width="245" height="12" rx="6" fill="#fde68a"/>
    <rect x="1020" y="330" width="175" height="10" rx="5" fill="#fbbf24"/>
  </g>
</svg>
