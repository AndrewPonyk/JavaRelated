name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # TODO: Configure Netlify deploy after NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are set.
      # - name: Deploy preview
      #   run: npx netlify deploy --dir=src --functions=netlify/functions
