services:
  plang:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["--version"]
    depends_on:
      registry-db:
        condition: service_healthy
    environment:
      PLANG_REGISTRY_DATABASE_URL: postgres://${PLANG_REGISTRY_DB_USER}:${PLANG_REGISTRY_DB_PASSWORD}@registry-db:5432/${PLANG_REGISTRY_DB_NAME}

  registry-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PLANG_REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${PLANG_REGISTRY_DB_PASSWORD}
      POSTGRES_DB: ${PLANG_REGISTRY_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - registry-db-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  registry-db-data:
