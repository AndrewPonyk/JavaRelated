[workspace]
members = [
  "crates/backend-api",
  "crates/cli",
  "crates/emitter",
  "crates/incremental",
  "crates/macros",
  "crates/parser",
  "crates/sourcemap",
  "crates/transforms",
  "crates/transpiler-core",
  "crates/wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.invalid/source-to-source-transpiler"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
lalrpop = "0.20"
lalrpop-util = { version = "0.20", features = ["lexer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tower-http = { version = "0.5", features = ["compression-full", "cors", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
