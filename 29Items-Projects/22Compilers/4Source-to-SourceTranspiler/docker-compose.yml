services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS required}
      RUST_LOG: ${RUST_LOG:-info,backend_api=debug}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-1048576}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PUBLISHED_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL required}
    depends_on:
      - api
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-5173}:80"

volumes:
  postgres-data:
