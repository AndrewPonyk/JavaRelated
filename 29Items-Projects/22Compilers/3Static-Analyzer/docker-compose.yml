services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: sqlite:////data/static_analyzer.db
      MIGRATIONS_PATH: /app/migrations
      RULES_CONFIG: /app/config/rules.example.yaml
    ports:
      - "8000:8000"
    volumes:
      - analyzer-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  analyzer:
    build:
      context: .
      dockerfile: docker/Dockerfile.analyzer
    profiles:
      - tools

volumes:
  analyzer-data:
