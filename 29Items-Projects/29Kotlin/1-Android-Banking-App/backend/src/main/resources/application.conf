ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.example.bank.backend.ApplicationKt.module ]
    }
}

# Persistence: enabled=false → zero-dependency in-memory demo mode (tests, :backend:run).
# Set DB_ENABLED=true (docker-compose does) + DATABASE_URL/DB_USER/DB_PASSWORD to use
# PostgreSQL via Exposed; Flyway applies db/migration on startup.
bank {
    database {
        enabled = false
        enabled = ${?DB_ENABLED}
        url = "jdbc:postgresql://localhost:5432/bank"
        url = ${?DATABASE_URL}
        user = "bank"
        user = ${?DB_USER}
        password = "bank"
        password = ${?DB_PASSWORD}
    }
}
