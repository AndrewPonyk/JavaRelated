ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ com.gym.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/gym_db"
    url = ${?DATABASE_URL}
    driver = "org.postgresql.Driver"
    driver = ${?DATABASE_DRIVER}
    user = "gym_admin"
    user = ${?DATABASE_USER}
    password = "super_secure_pg_password"
    password = ${?DATABASE_PASSWORD}
}

jwt {
    secret = "gym-api-super-secret-key-32-chars-minimum-for-production"
    secret = ${?JWT_SECRET}
    issuer = "https://api.gymmembership.com/"
    issuer = ${?JWT_ISSUER}
    audience = "gym-api-consumers"
    audience = ${?JWT_AUDIENCE}
    realm = "GymMembershipRealm"
    realm = ${?JWT_REALM}
    expirationHours = "24"
    expirationHours = ${?JWT_EXPIRATION_HOURS}
}

gym {
    maxCapacity = 250
    maxCapacity = ${?MAX_GYM_CAPACITY}
    antiPassbackCooldownMinutes = 15
    antiPassbackCooldownMinutes = ${?ANTI_PASSBACK_COOLDOWN_MINUTES}
}

webhook {
    enabled = "false"
    enabled = ${?WEBHOOK_ENABLED}
    endpointUrl = "https://webhook.site/gym-expiry-alerts"
    endpointUrl = ${?WEBHOOK_ENDPOINT_URL}
}

