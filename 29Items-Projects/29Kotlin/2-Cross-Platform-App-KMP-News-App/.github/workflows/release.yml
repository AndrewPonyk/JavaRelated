name: Multiplatform Release Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  release-android:
    name: Build & Publish Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Android App Bundle
        run: |
          cd Cross-Platform-App-KMP-News-App
          chmod +x ./gradlew
          ./gradlew :androidApp:bundleRelease

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: Cross-Platform-App-KMP-News-App/androidApp/build/outputs/bundle/release/*.aab
