name: Multiplatform Release Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  release-android:
    name: Build & Publish Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Android App Bundle
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:bundleRelease

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: androidApp/build/outputs/bundle/release/*.aab

  release-desktop:
    name: Build Desktop Distribution Packages
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Native Distribution Package
        shell: bash
        run: |
          chmod +x ./gradlew || true
          ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pkg-${{ matrix.os }}
          path: desktopApp/build/compose/binaries/main/
