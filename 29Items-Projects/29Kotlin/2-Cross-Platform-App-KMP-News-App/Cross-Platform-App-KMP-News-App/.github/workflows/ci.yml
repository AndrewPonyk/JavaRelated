name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint & Shared Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run JVM & Android Host Tests
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest --stacktrace

  android-build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Android App
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  desktop-build:
    name: Build Desktop JAR & Package
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Desktop Application
        run: |
          chmod +x ./gradlew
          ./gradlew :desktopApp:packageUberJarForCurrentOS

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jar
          path: desktopApp/build/compose/jars/*.jar

  ios-build:
    name: Build iOS Framework
    runs-on: macos-14
    needs: lint-and-unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run iOS Simulator Tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:iosSimulatorArm64Test
