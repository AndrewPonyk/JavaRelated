build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  LongMethod:
    threshold: 60
  ComplexCondition:
    threshold: 4
  CyclomaticComplexMethod:
    threshold: 15

naming:
  active: true
  FunctionNaming:
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    ignoreAnnotated: ['Composable']

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '100', '1000']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
