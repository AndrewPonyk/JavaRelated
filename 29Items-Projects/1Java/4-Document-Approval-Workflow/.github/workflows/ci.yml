name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Backend CI (Java 17, Vert.x, Maven, JUnit5)
  backend-ci:
    name: Backend Lint & Test (Java 17)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: document_workflow

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Tests
        working-directory: ./backend
        run: mvn clean test -B

      - name: Verify Fat JAR Package
        working-directory: ./backend
        run: mvn package -DskipTests -B

  # 2. NLP Service CI (Python 3.11, spaCy)
  nlp-ci:
    name: NLP Microservice Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./nlp-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_md

      - name: Lint Check
        working-directory: ./nlp-service
        run: |
          pip install flake8
          flake8 main.py --max-line-length=120 --count

  # 3. Frontend CI (Node 20, TypeScript, Vite)
  frontend-ci:
    name: Frontend Lint & Build (React TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type Check & Build
        working-directory: ./frontend
        run: npm run build
