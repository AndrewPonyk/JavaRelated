apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-backend
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-backend
    app.kubernetes.io/part-of: inventory-management
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-backend
        app.kubernetes.io/part-of: inventory-management
    spec:
      serviceAccountName: inventory-runtime
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: inventory-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: inventory-config }
            - secretRef: { name: inventory-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: temporary-files, mountPath: /tmp }
      volumes:
        - name: temporary-files
          emptyDir: {}
