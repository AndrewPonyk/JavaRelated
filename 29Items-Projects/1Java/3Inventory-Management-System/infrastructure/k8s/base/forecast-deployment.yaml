apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-forecast
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-forecast
    app.kubernetes.io/part-of: inventory-management
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-forecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-forecast
        app.kubernetes.io/part-of: inventory-management
    spec:
      serviceAccountName: inventory-runtime
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-forecast
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: forecast
          image: inventory-forecast:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: inventory-config }
            - secretRef: { name: inventory-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: temporary-files, mountPath: /tmp }
      volumes:
        - name: temporary-files
          emptyDir: {}
