# Example shape only. Do not apply or commit real values; provision inventory-secrets externally.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: inventory
type: Opaque
stringData:
  OIDC_ISSUER_URI: https://identity.example.com/realms/inventory
  OIDC_AUDIENCE: inventory-api
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.example.internal:3306/inventory?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: replace-me
  SPRING_DATASOURCE_PASSWORD: replace-me
  REDIS_URL: rediss://replace-me@redis.example.internal:6379/0
  MODEL_ADMIN_TOKEN: replace-with-a-random-secret
