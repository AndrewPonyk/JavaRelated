spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:inventory}
    password: ${SPRING_DATASOURCE_PASSWORD}
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}

app:
  security:
    enabled: false
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
