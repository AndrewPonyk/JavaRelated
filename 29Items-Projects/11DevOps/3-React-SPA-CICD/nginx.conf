# nginx config for the optional container path (see Dockerfile).
# Implements the same contract as every other hosting target:
# SPA fallback, immutable-asset caching, plus the security headers static hosting can't set.
#
# ⚠ add_header inheritance: a location with its own add_header discards ALL inherited
#   add_headers — hence the security-headers include is repeated per location
#   (docs/TECH-NOTES.md §3.6 #12, verified against the running container).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers for locations that don't declare their own add_header (e.g. /healthz).
    include /etc/nginx/snippets/security-headers.conf;

    # ── Caching contract (docs/ARCHITECTURE.md §2.4) ────────────────────────────────
    # Content-hashed assets: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Container orchestrator health probe (no add_header → inherits the server-level set).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA fallback: every unknown path serves index.html (never cached).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
