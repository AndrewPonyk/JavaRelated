# Security headers, included at server level AND in every location that sets its own
# add_header. Required because nginx add_header directives DO NOT inherit into a location
# that declares any add_header of its own (docs/TECH-NOTES.md §3.6 #12).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS: safe to emit even behind a TLS-terminating proxy (browsers only honor it over
# HTTPS). Add `preload` only after the domain is submitted to the preload list.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Tighten later: stricter CSP after auditing GA + API origins; add report-uri first.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://api.example.com https://*.google-analytics.com; img-src 'self' data: https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
