# `docker compose up` → full self-contained stack on http://localhost:8080
# The SPA is built with the MSW mock backend enabled, so the "full stack" (UI + API
# behavior) runs from this one service — the real Portal API is a separate deployment.
# Sign in with demo@example.com / Password123!
services:
  web:
    build:
      context: .
      args:
        VITE_ENV_NAME: local
        VITE_API_BASE_URL: /api
        VITE_ENABLE_MSW: 'true'
        VITE_GA_MEASUREMENT_ID: ''
        VITE_APP_VERSION: compose
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
