# ══════════════════════════════════════════════════════════════════════════════
# CloudFormation — PR preview infrastructure (deploy ONCE, previews reuse it).
# Private S3 bucket + CloudFront (Origin Access Control) + a CloudFront Function
# that gives every /pr-<n>/ prefix its own SPA fallback.
#
# Deploy:
#   aws cloudformation deploy --stack-name portal-pr-previews \
#     --template-file infra/aws/pr-preview-stack.yml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides GitHubOrg=your-org GitHubRepo=customer-portal-spa
#
# TODO: add the ACM certificate + Route53 alias for PREVIEW_DOMAIN (region us-east-1
#       for CloudFront certs), then set the Aliases block below.
# ══════════════════════════════════════════════════════════════════════════════
AWSTemplateFormatVersion: '2010-09-09'
Description: Customer Portal SPA — per-PR preview hosting (S3 + CloudFront + OIDC deploy role)

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org allowed to assume the deploy role via OIDC
  GitHubRepo:
    Type: String
    Description: Repository name allowed to assume the deploy role

Resources:
  PreviewBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-previews'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Safety net: orphaned previews (cleanup workflow failed) expire on their own.
          - Id: ExpireStalePreviews
            Status: Enabled
            ExpirationInDays: 30

  PreviewBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PreviewBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${PreviewBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${PreviewDistribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Rewrites /pr-123/some/route → /pr-123/index.html so SPA deep links work per prefix.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: SPA fallback per /pr-<n>/ prefix
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var match = uri.match(/^(\/pr-\d+)\//);
          if (match) {
            var last = uri.split('/').pop();
            // No file extension → SPA route → serve the prefix's index.html
            if (last && !last.includes('.')) {
              request.uri = match[1] + '/index.html';
            }
          }
          return request;
        }

  PreviewDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Customer Portal PR previews
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        # TODO: Aliases + ViewerCertificate once PREVIEW_DOMAIN's ACM cert exists.
        Origins:
          - Id: preview-s3
            DomainName: !GetAtt PreviewBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: preview-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true # gzip/brotli at the edge — S3 stores the objects uncompressed
          # AWS managed CachingOptimized policy — honors the objects' Cache-Control headers.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN

  # OIDC deploy role — GitHub Actions assumes this; no long-lived keys anywhere.
  # Assumes the account already has the GitHub OIDC provider
  # (token.actions.githubusercontent.com); create it once per account if missing.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-deploy'
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      Policies:
        - PolicyName: preview-deploy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt PreviewBucket.Arn, !Sub '${PreviewBucket.Arn}/*']
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${PreviewDistribution}'

Outputs:
  PreviewBucketName:
    Description: Set as PREVIEW_BUCKET repo variable
    Value: !Ref PreviewBucket
  DistributionId:
    Description: Set as PREVIEW_CF_DISTRIBUTION_ID repo variable
    Value: !Ref PreviewDistribution
  DistributionDomain:
    Description: Set as PREVIEW_DOMAIN repo variable (until a custom domain exists)
    Value: !GetAtt PreviewDistribution.DomainName
  DeployRoleArn:
    Description: Set as AWS_ROLE_ARN secret
    Value: !GetAtt DeployRole.Arn
