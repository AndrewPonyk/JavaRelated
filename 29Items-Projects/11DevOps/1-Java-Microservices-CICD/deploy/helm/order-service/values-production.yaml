# Production overlay — bumped ONLY by cd-production.yml after the risk gate
# and the environment approval. ArgoCD app for prod is manual-sync.

image:
  tag: "REPLACED_BY_CI"   # promoted, staging-proven git SHA

springProfile: production

autoscaling:
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

pdb:
  minAvailable: 2

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 1536Mi

# Rolling is the default for production (boring on purpose).
# For releases the risk model flags (score >= 0.6): set enabled: true in the SAME
# promotion commit, verify via the -preview Service, then promote/abort with
# `kubectl argo rollouts`. Requires the Argo Rollouts controller in the cluster.
blueGreen:
  enabled: false
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 600

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Actuator lives on the management port (8081) — point the target-group health
    # check there. target-type=ip lets the controller open the pod SG for it.
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-port: "8081"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # TODO: alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
  hosts:
    - host: orders.example.com   # TODO: real production domain
      paths:
        - path: /
          pathType: Prefix

serviceAccount:
  annotations:
    # TODO: real IRSA role for production
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/order-service-production

config:
  # TODO: production RDS endpoint
  SPRING_DATASOURCE_URL: jdbc:postgresql://orders-prod.cluster-xxxx.eu-central-1.rds.amazonaws.com:5432/orders
  DB_POOL_SIZE: "10"
  # JWT enforcement switches on the moment this is set (see SecurityConfig):
  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://idp.example.com/realms/orders

externalSecrets:
  enabled: true
  dataKey: orders/production/db

metrics:
  serviceMonitor:
    enabled: true

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: order-service
