apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-service.fullname" . }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    # Cluster-internal only: the Ingress routes the named `http` port exclusively,
    # so actuator (probes/metrics) is reachable for Prometheus but not from the ALB.
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
  selector:
    {{- include "order-service.selectorLabels" . | nindent 4 }}
