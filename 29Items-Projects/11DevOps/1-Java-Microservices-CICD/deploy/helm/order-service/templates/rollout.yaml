{{- if .Values.blueGreen.enabled }}
# Blue/green delivery via Argo Rollouts (controller must be installed).
# The green stack is reachable through the -preview Service for verification;
# traffic flips on promotion:  kubectl argo rollouts promote {{ include "order-service.fullname" . }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "order-service.fullname" . }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "order-service.selectorLabels" . | nindent 6 }}
  strategy:
    blueGreen:
      activeService: {{ include "order-service.fullname" . }}
      previewService: {{ include "order-service.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
  template:
    {{- include "order-service.podTemplate" . | nindent 4 }}
{{- end }}
