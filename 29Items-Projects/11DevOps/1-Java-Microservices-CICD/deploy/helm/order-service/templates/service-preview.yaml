{{- if .Values.blueGreen.enabled }}
# Preview endpoint for the green stack — smoke-test here before promoting.
# Argo Rollouts injects the pod-template-hash selector on both Services.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-service.fullname" . }}-preview
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "order-service.selectorLabels" . | nindent 4 }}
{{- end }}
