apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "order-service.fullname" . }}-test-connection"
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
        - -qO-
        # health lives on the management port (cluster-internal by design)
        - "{{ include "order-service.fullname" . }}:8081/actuator/health"
