{{- if .Values.externalSecrets.enabled }}
# Syncs DB credentials from AWS Secrets Manager into a Kubernetes Secret.
# Requires the External Secrets Operator and a ClusterSecretStore
# named {{ .Values.externalSecrets.secretStore }} (IRSA-backed).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "order-service.fullname" . }}-db
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "order-service.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    # The Secrets Manager entry is a JSON object whose keys become env vars:
    # { "SPRING_DATASOURCE_USERNAME": "...", "SPRING_DATASOURCE_PASSWORD": "..." }
    - extract:
        key: {{ .Values.externalSecrets.dataKey }}
{{- end }}
