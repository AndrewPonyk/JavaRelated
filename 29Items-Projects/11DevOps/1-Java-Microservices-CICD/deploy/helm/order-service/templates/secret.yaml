{{- if and .Values.secret.create (not .Values.externalSecrets.enabled) (not .Values.existingSecret) }}
# DEV-ONLY fallback for clusters without External Secrets (kind/minikube).
# Real environments must use externalsecret.yaml — never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "order-service.secretName" . }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
