# Local docker-compose Prometheus config (profile: observability).
# In EKS this is replaced by kube-prometheus-stack + the chart's ServiceMonitor.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081   # management port — service running on the host
          - order-service:8081          # management port — service running in compose
        labels:
          env: local
