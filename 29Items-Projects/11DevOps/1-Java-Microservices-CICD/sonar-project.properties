# NOTE: The canonical SonarQube analysis for this repo is Maven-based
# (`mvn sonar:sonar` in ci.yml), which reads configuration from pom.xml.
# This file exists only for ad-hoc scans with the standalone sonar-scanner CLI
# (e.g. scanning non-Maven assets) and mirrors the Maven settings.

sonar.projectKey=example.ecommerce:order-service
sonar.projectName=Order Service
sonar.sourceEncoding=UTF-8

sonar.sources=services/order-service/src/main/java
sonar.tests=services/order-service/src/test/java
sonar.java.binaries=services/order-service/target/classes
sonar.java.source=21

sonar.coverage.jacoco.xmlReportPaths=services/order-service/target/site/jacoco/jacoco.xml
# Keep aligned with the JaCoCo excludes in services/order-service/pom.xml
sonar.coverage.exclusions=**/OrderServiceApplication.java,**/config/**,**/api/dto/**
