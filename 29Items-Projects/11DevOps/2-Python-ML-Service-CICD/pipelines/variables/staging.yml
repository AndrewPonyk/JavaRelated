# Variable template: staging environment.
variables:
  environmentName: staging
  resourceGroup: rg-fraud-detection-staging
  aksCluster: fraud-aks-staging
  aksNamespace: fraud-detection
  imageRepository: fraud-detection-api
  containerRegistry: frauddetectacr.azurecr.io
  overlayPath: k8s/overlays/staging
  # Service connection names as configured in Azure DevOps Project Settings.
  aksServiceConnection: aks-fraud-detection-staging
  azureServiceConnection: azure-fraud-detection-staging
  # ADO environment used by deployment jobs - add an approval check on it.
  adoEnvironment: fraud-detection-staging
  # Blue-green: staging rolls the active color directly.
  activeColor: blue
  targetColor: blue
  # NOTE: replace with the real MLflow tracking endpoint for staging.
  mlflowTrackingUri: http://mlflow-staging.fraud-detection.internal:5000
  # Azure ML workspace used by retraining / drift jobs.
  amlWorkspace: mlw-fraud-detection-staging
