# Grafana dashboard provisioning: load JSON dashboards from disk.
# The docker-compose file mounts monitoring/grafana/dashboards at
# /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: fraud-detection
    orgId: 1
    folder: Fraud Detection
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
