# Staging overlay - 2 replicas, staging image tag, FRAUD_ENVIRONMENT=staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: frauddetectacr.azurecr.io/fraud-detection-api
    newTag: staging  # placeholder - the CD pipeline runs `kustomize edit set image ...:<build-tag>`

patches:
  - path: patch-replicas.yaml
  # Per-environment config (base ConfigMap is a plain resource, so we patch
  # rather than use configMapGenerator behavior:merge).
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: fraud-api-config
      data:
        FRAUD_ENVIRONMENT: "staging"
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: fraud-api
      spec:
        rules:
          - host: fraud-api.staging.example.com
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: fraud-api
                      port:
                        number: 80
