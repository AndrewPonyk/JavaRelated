[tool.poetry]
name = "fraud-detection"
version = "0.1.0"
description = "Fraud Detection API: FastAPI ML service with A/B testing, drift detection, and automated retraining on Azure."
authors = ["ML Platform Team <ml-platform@example.com>"]
readme = "README.md"
packages = [{ include = "fraud_detection", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.8"
pydantic-settings = "^2.4"
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg2-binary = "^2.9"
mlflow-skinny = "^2.16"
scikit-learn = "^1.5"
numpy = "^2.0"
pandas = "^2.2"
prometheus-client = "^0.20"
structlog = "^24.4"
httpx = "^0.27"
joblib = "^1.4"

[tool.poetry.group.azure]
optional = true

[tool.poetry.group.azure.dependencies]
azure-ai-ml = "^1.19"
azure-identity = "^1.17"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.6.0"
mypy = "^1.11"
pre-commit = "^3.8"
types-requests = "^2.32"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_detection"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
# Silence the pytest-asyncio deprecation nag about the unset default fixture
# loop scope (the future default; harmless when the plugin is installed).
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Third-party: sklearn's lbfgs solver passes `disp`/`iprint` to scipy,
    # deprecated in SciPy >= 1.15 and slated for removal in 1.18.
    "ignore:.*The `disp` and `iprint` options of the L-BFGS-B solver are deprecated:DeprecationWarning",
]
markers = [
    "unit: fast, isolated unit tests (no external services)",
    "integration: tests that need PostgreSQL / MLflow / network",
    "model: tests that exercise ML model behaviour and evaluation gates",
]

[tool.coverage.run]
source = ["fraud_detection"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "\\.\\.\\.",
]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
