name: Deploy to Firebase App Distribution

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  deploy_android:
    name: Build & Distribute Android (Firebase)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: "${{ env.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build Android APK
        run: |
          flutter build apk --release --dart-define=APP_ENV=production

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'internal-testers' }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Automated build from commit ${{ github.sha }} on ${{ github.ref_name }}"
