[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-platform-backend"
version = "1.0.0"
description = "Serverless SaaS Backend Microservices"
authors = [{ name = "SaaS Platform Team" }]
dependencies = [
    "boto3>=1.34.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.1.0",
    "aws-lambda-powertools[all]>=2.34.0",
    "requests>=2.31.0",
    "python-jose[cryptography]>=3.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
