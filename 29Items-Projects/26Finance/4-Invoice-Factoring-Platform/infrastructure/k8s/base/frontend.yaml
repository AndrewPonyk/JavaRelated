apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: invoice-factoring, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: invoice-factoring, component: frontend }
  template:
    metadata:
      labels: { app: invoice-factoring, component: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: invfactacr.azurecr.io/invoice-factoring-frontend:latest # overlay patches tag
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: invoice-factoring, component: frontend }
spec:
  selector: { app: invoice-factoring, component: frontend }
  ports:
    - port: 80
      targetPort: 8080
