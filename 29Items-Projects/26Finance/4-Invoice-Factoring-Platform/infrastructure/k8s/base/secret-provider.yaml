# Syncs secrets from Azure Key Vault into a Kubernetes Secret via the Secrets Store CSI
# driver, using AKS workload identity. No secrets are ever baked into images (ARCHITECTURE §2.5).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: platform-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<workload-identity-client-id>"   # TODO: overlay/patch per environment
    keyvaultName: "invfact-dev-kv"               # TODO: overlay/patch per environment
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: sql-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: servicebus-connection-string
          objectType: secret
        - |
          objectName: stripe-secret-key
          objectType: secret
        - |
          objectName: stripe-webhook-secret
          objectType: secret
        - |
          objectName: plaid-secret
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
  secretObjects:
    - secretName: platform-secrets
      type: Opaque
      data:
        - { objectName: sql-connection-string,        key: sql-connection-string }
        - { objectName: redis-connection-string,      key: redis-connection-string }
        - { objectName: servicebus-connection-string, key: servicebus-connection-string }
        - { objectName: stripe-secret-key,            key: stripe-secret-key }
        - { objectName: stripe-webhook-secret,        key: stripe-webhook-secret }
        - { objectName: plaid-secret,                 key: plaid-secret }
        - { objectName: appinsights-connection-string, key: appinsights-connection-string }
