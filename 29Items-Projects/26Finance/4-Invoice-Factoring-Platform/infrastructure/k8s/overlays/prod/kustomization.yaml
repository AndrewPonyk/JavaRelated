apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: invoice-factoring-prod

resources:
  - ../../base

images:
  - name: invfactacr.azurecr.io/invoice-factoring-api
    newTag: prod-latest
  - name: invfactacr.azurecr.io/invoice-factoring-frontend
    newTag: prod-latest

replicas:
  - name: api
    count: 3
  - name: frontend
    count: 3

# Tighten the API autoscaler floor for production traffic.
patches:
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
