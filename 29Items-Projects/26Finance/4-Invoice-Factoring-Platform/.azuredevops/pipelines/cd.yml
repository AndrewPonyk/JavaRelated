# CD stages: promote the SAME image SHA dev → staging → prod.
# Approvals/gates are configured on the Azure DevOps *Environments* (not in YAML), so
# staging and prod require manual sign-off (TECH-NOTES §3.1 / §3.3).
parameters:
  - name: tag
    type: string

stages:
  - stage: deploy_dev
    displayName: Deploy → dev
    dependsOn: CI
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: dev
          overlay: infrastructure/k8s/overlays/dev
          tag: ${{ parameters.tag }}

  - stage: deploy_staging
    displayName: Deploy → staging
    dependsOn: deploy_dev
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: staging
          overlay: infrastructure/k8s/overlays/staging
          tag: ${{ parameters.tag }}

  - stage: deploy_prod
    displayName: Deploy → prod
    dependsOn: deploy_staging
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: prod
          overlay: infrastructure/k8s/overlays/prod
          tag: ${{ parameters.tag }}
