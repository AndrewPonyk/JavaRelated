[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-dashboard-backend"
version = "0.1.0"
description = "Portfolio optimizer: MPT, VaR/CVaR, Sharpe, Monte Carlo."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "hypothesis==6.122.3",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "pip-audit==2.7.3",
]

[tool.pytest.ini_options]
# Run from the `backend/` dir; make `app` importable without installation.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are call-in-default by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = []

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
