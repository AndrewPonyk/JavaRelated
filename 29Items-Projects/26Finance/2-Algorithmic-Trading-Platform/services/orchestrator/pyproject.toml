[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.1.0"
description = "Single-process paper-trading composition of all control-plane services"
requires-python = ">=3.11"
dependencies = [
    "trading-common",
    "strategy-engine",
    "risk-engine",
    "market-data",
    "pnl-projector",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
paper-trade = "orchestrator.main:main"

[tool.setuptools.packages.find]
where = ["src"]
