[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-common"
version = "0.1.0"
description = "Shared domain models, indicators, persistence, and messaging for the Algorithmic Trading Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",          # dev/test database driver
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
kafka = ["aiokafka>=0.10"]
# Optional native accelerator for indicators (set TRADING_USE_TALIB=1):
talib = ["TA-Lib>=0.4.28"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["trading_common*"]
