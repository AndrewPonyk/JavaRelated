[package]
name = "image-processor"
version = "0.1.0"
description = "Deterministic RGBA image operations compiled to WebAssembly"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.76"
wasm-bindgen = "0.2.99"

[dev-dependencies]
proptest = "1.6.0"
wasm-bindgen-test = "0.3.49"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
