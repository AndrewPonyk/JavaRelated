# Supply the app name with `fly deploy --app <production-app>` or FLY_APP_NAME in CI.
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/chat-server --migrate-only"
  strategy = "rolling"

[env]
  APP_ENV = "production"
  APP_HOST = "0.0.0.0"
  APP_PORT = "8080"
  DATABASE_MAX_CONNECTIONS = "10"
  RUST_LOG = "chat_backend=info,tower_http=info"
  STATIC_DIR = "/app/frontend"
  MIGRATIONS_DIR = "/app/migrations"
  SECURE_COOKIES = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "3s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
