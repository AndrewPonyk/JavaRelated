[package]
name = "json-processor"
version = "0.1.0"
edition = "2021"
authors = ["Author <author@example.com>"]
description = "A high-performance command-line JSON processor"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
