# Local development stack — mirrors the production topology so integration
# tests and manual testing behave like the cloud (TECH-NOTES §3.4).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      elasticsearch: {condition: service_started}

  worker:
    build: ./backend
    command: celery -A config worker -Q default,email --loglevel=info
    volumes: ["./backend:/app"]
    env_file: [.env]
    depends_on: [redis, db]

  worker-ml:
    build: ./backend
    command: celery -A config worker -Q ml --loglevel=info --concurrency=1
    volumes: ["./backend:/app"]
    env_file: [.env]
    depends_on: [redis, db]

  beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    volumes: ["./backend:/app"]
    env_file: [.env]
    depends_on: [redis]

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]

volumes:
  pgdata:
