[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts =
    --strict-markers
    --cov=apps
    --cov=common
    --cov-report=term-missing
    --cov-fail-under=70
markers =
    integration: tests that hit real Postgres/Redis/Elasticsearch (slower)
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
