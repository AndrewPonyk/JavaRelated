name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements/development.txt
      - run: ruff check .
      - run: black --check .
      # Type-checking is informational (gradual typing on a Django codebase).
      - run: mypy apps common config
        continue-on-error: true
      # Dependency vulnerability scan (informational — newly disclosed CVEs
      # surface here without blocking the deploy pipeline).
      - run: pip-audit -r requirements/production.txt
        continue-on-error: true

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports: ["9200:9200"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce
      REDIS_URL: redis://localhost:6379/0
      ELASTICSEARCH_URL: http://localhost:9200
      DJANGO_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements/development.txt
      - run: python manage.py migrate --noinput
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
        continue-on-error: true
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  build-images:
    needs: [backend-lint, backend-test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ecommerce-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t ecommerce-frontend:${{ github.sha }} ./frontend
      # TODO: trivy scan, then push to ECR (see cd-staging.yml).
