# SPA + reverse proxy for the metrics API (REST and WebSocket).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Baseline security headers (TLS/HSTS terminate at the ALB/CloudFront layer).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # REST + WebSocket to the API service (compose service name "api").
    # Upgrade headers set unconditionally — harmless for plain REST calls.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # long-lived metric stream sockets
    }

    # Angular router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
