# Reusable deploy: called by cd.yml per environment. Environment-scoped
# GitHub vars/secrets (AWS_DEPLOY_ROLE_ARN, MWAA_DAGS_BUCKET, ...) resolve
# against the `environment:` binding, so one definition serves dev/staging/prod.
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy (dev/staging/production)
        type: string
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # protection rules gate staging/prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: sync Airflow DAGs to MWAA bucket
        run: |
          aws s3 sync airflow/dags "s3://${{ vars.MWAA_DAGS_BUCKET }}/dags" --delete
          aws s3 cp airflow/requirements.txt "s3://${{ vars.MWAA_DAGS_BUCKET }}/requirements.txt"

      - name: upload Glue job scripts
        run: aws s3 sync glue/jobs "s3://${{ vars.ARTIFACTS_BUCKET }}/glue" --delete

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snowflake migrations (schemachange)
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          pip install "schemachange~=3.7"
          schemachange -f migrations \
            -a "${{ vars.SNOWFLAKE_ACCOUNT }}" -u "${{ vars.SNOWFLAKE_USER }}" \
            -r SYSADMIN -w LOAD_WH \
            -c "RAW.METADATA.CHANGE_HISTORY" --create-change-history-table

      - name: roll ECS services to the new images
        run: |
          for svc in api processor; do
            aws ecs update-service \
              --cluster "${{ vars.ECS_CLUSTER }}" \
              --service "$svc" \
              --force-new-deployment
          done

      - name: run dbt build (ECS task)
        if: ${{ vars.DBT_ECS_TASK_DEF != '' }}
        run: |
          aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "${{ vars.DBT_ECS_TASK_DEF }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNET_IDS }}],assignPublicIp=DISABLED}"

      - name: smoke test
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "${{ vars.API_BASE_URL }}/healthz" >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "API failed health check after deploy" >&2; exit 1
