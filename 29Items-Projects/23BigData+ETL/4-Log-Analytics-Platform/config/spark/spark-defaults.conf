# Spark defaults for local/dev runs (spark-submit --properties-file config/spark/spark-defaults.conf).
# EMR Serverless equivalents are set as job-run sparkSubmitParameters in deploy.yml / Terraform.

spark.sql.session.timeZone                UTC
spark.sql.adaptive.enabled                true
spark.sql.shuffle.partitions              24
spark.serializer                          org.apache.spark.serializer.KryoSerializer

# Streaming hygiene
spark.sql.streaming.metricsEnabled        true
spark.sql.streaming.stopGracefullyOnShutdown  true

# Local-run memory (EMR sizes come from the application config in emr_serverless.tf)
spark.driver.memory                       2g
spark.executor.memory                     2g

