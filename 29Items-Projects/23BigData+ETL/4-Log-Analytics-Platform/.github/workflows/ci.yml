# CI: lint → typecheck → unit → integration → build/push images.
# Assumes this project is the repository root (see TECH-NOTES pitfall #12).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt -r requirements-spark.txt
      - run: mypy src

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests + coverage
        run: pytest --cov --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # Spark transformation tests need pyspark + a JVM (test_spark_transforms.py).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt -r requirements-spark.txt
      - name: Start Kafka + OpenSearch
        run: docker compose up -d --wait kafka opensearch
      - name: Integration tests
        env:
          LA_KAFKA_BOOTSTRAP_SERVERS: localhost:29092
          LA_OPENSEARCH_URL: http://localhost:9200
        run: pytest -m integration
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200

  build-images:
    # Build always (PR validation); push to ECR only from main.
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    permissions:
      id-token: write     # OIDC → AWS, no stored keys
      contents: read
    strategy:
      matrix:
        image: [app, spark]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}   # TODO: set repo variable (from infra/terraform/iam.tf output)
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ecr.outputs.registry || 'local' }}/log-analytics-${{ matrix.image }}:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry || 'local' }}/log-analytics-${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
