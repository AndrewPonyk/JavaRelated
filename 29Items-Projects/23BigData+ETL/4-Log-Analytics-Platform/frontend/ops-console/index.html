<!doctype html>
<!--
  Ops Console — zero-build internal page served by the API at /console/.
  Demonstrates the frontend patterns for this stack: fetch → loading → error/retry → render.
  Heavy visualization intentionally lives in Kibana/OpenSearch Dashboards; this console is
  for quick operational state (alert rules + recent logs) without leaving the API host.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Analytics — Ops Console</title>
  <style>
    :root { color-scheme: dark; --bg:#0e1116; --panel:#161b23; --line:#232a35;
            --text:#d7dee8; --dim:#8b96a5; --accent:#4da3ff;
            --ok:#3fb950; --warn:#d29922; --crit:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
    header { display:flex; gap:12px; align-items:baseline; padding:16px 24px;
             border-bottom:1px solid var(--line); }
    h1 { font-size:16px; margin:0; } h1 span { color:var(--accent); }
    header small { color:var(--dim); }
    main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px 24px; }
    @media (max-width: 900px) { main { grid-template-columns:1fr; } }
    section { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    section > h2 { font-size:13px; margin:0; padding:10px 14px; border-bottom:1px solid var(--line);
                   color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
    .body { padding:12px 14px; min-height:120px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--dim); font-weight:normal; }
    .sev-info { color:var(--ok); } .sev-warning, .lvl-WARN { color:var(--warn); }
    .sev-critical, .lvl-ERROR, .lvl-FATAL { color:var(--crit); }
    .spinner { color:var(--dim); }
    .spinner::after { content:""; display:inline-block; width:1em; animation:dots 1.2s steps(4) infinite; }
    @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
    .error { color:var(--crit); }
    .error button { margin-left:10px; background:none; border:1px solid var(--crit);
                    color:var(--crit); border-radius:4px; padding:2px 10px; cursor:pointer; font:inherit; }
    .empty { color:var(--dim); }
    footer { padding:8px 24px; color:var(--dim); font-size:12px; }
    label { color:var(--dim); font-size:12px; margin-left:auto; user-select:none; }
  </style>
</head>
<body>
  <header>
    <h1>log-analytics <span>ops console</span></h1>
    <small id="updated-at">never refreshed</small>
    <label><input type="checkbox" id="auto-refresh" checked> auto-refresh 30s</label>
  </header>

  <main>
    <section>
      <h2>Alert rules</h2>
      <div class="body" id="rules-panel"></div>
    </section>
    <section>
      <h2>Recent logs (la-logs)</h2>
      <div class="body" id="logs-panel"></div>
    </section>
  </main>

  <footer>API: <code>/api/v1</code> · dashboards live in Kibana / OpenSearch Dashboards (:5601)</footer>

  <script>
    "use strict";
    const API_BASE = "/api/v1";

    // ── Panel helper: one place implements loading / error / empty / render ──
    async function loadPanel(el, url, render, emptyText) {
      el.innerHTML = '<div class="spinner">loading</div>';
      try {
        const resp = await fetch(url, { headers: { Accept: "application/json" } });
        if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${(await resp.text()).slice(0, 120)}`);
        const data = await resp.json();
        el.innerHTML = "";
        const node = render(data);
        if (node) el.appendChild(node);
        else el.innerHTML = `<div class="empty">${emptyText}</div>`;
      } catch (err) {
        el.innerHTML = "";
        const box = document.createElement("div");
        box.className = "error";
        box.textContent = `failed: ${err.message}`;
        const retry = document.createElement("button");
        retry.textContent = "retry";
        retry.onclick = () => loadPanel(el, url, render, emptyText);
        box.appendChild(retry);
        el.appendChild(box);
      }
    }

    function table(headers, rows) {
      if (!rows.length) return null;
      const t = document.createElement("table");
      t.innerHTML = "<thead><tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr></thead>";
      const tbody = document.createElement("tbody");
      for (const cells of rows) {
        const tr = document.createElement("tr");
        for (const cell of cells) {
          const td = document.createElement("td");
          if (cell && typeof cell === "object") { td.textContent = cell.text; td.className = cell.cls || ""; }
          else td.textContent = cell ?? "";
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      t.appendChild(tbody);
      return t;
    }

    const renderRules = (data) => table(
      ["name", "metric", "condition", "severity", "enabled"],
      (data.items || []).map(r => [
        r.name, r.metric, `${r.op} ${r.threshold} / ${r.window}`,
        { text: r.severity, cls: "sev-" + r.severity },
        r.enabled ? "yes" : "no",
      ]));

    const renderLogs = (data) => table(
      ["time", "service", "level", "message"],
      (data.hits || []).map(h => [
        (h["@timestamp"] || "").replace("T", " ").slice(0, 19),
        h.service,
        { text: h.level, cls: "lvl-" + h.level },
        (h.message || "").slice(0, 140),
      ]));

    function refresh() {
      document.getElementById("updated-at").textContent =
        "updated " + new Date().toLocaleTimeString();
      loadPanel(document.getElementById("rules-panel"),
        `${API_BASE}/alert-rules?limit=50`, renderRules, "no alert rules defined yet");
      loadPanel(document.getElementById("logs-panel"),
        `${API_BASE}/logs/search?size=25`, renderLogs, "no logs indexed yet — run scripts/seed_sample_logs.py");
    }

    refresh();
    setInterval(() => { if (document.getElementById("auto-refresh").checked) refresh(); }, 30000);
  </script>
</body>
</html>
