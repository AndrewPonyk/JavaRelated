# Federation demo: query the catalog metadata DB next to lake tables, e.g.
#   SELECT * FROM catalogdb.public.datasets;
# Also the pattern for joining operational DBs with the lake without ETL.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/catalog
connection-user=lakehouse
connection-password=lakehouse
# In AWS these credentials come from Secrets Manager via Trino's secrets
# provider (${SECRET:...}), and the connection user is read-only.
