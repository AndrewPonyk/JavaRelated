# Trino Delta Lake connector — reads the lake tables in place.
# Deployed to the AWS Trino cluster (catalog-aws/ is NOT mounted locally:
# the Glue metastore client refuses to start without an AWS region, which
# would take the whole local server down).
connector.name=delta_lake

# Glue is the metastore (tables registered by Spark jobs / crawlers);
# credentials and region come from the instance profile.
hive.metastore=glue

# --- Local development note -------------------------------------------------
# The Delta connector requires a metastore; MinIO alone is not enough.
# To query Delta locally, add a hive-metastore service to docker-compose,
# copy this file into infra/docker/trino/catalog/ and use:
#   hive.metastore=thrift
#   hive.metastore.uri=thrift://hive-metastore:9083
#   hive.s3.endpoint=http://minio:9000
#   hive.s3.path-style-access=true
#   hive.s3.aws-access-key=minioadmin
#   hive.s3.aws-secret-key=minioadmin
# Default local setup: Postgres federation only (catalog/catalogdb.properties).
