[project]
name = "lakehouse"
version = "0.1.0"
description = "Data Lakehouse Platform - Spark ingestion, medallion jobs, ML feature pipelines"
requires-python = ">=3.11"
dependencies = [
  # Delta 3.2.x pairs with Spark 3.5.x - keep in lockstep with the EMR release label
  "pyspark>=3.5.4,<3.6",
  "delta-spark==3.2.0",
  "kafka-python>=2.2", # producer for dev tooling and low-volume production topics
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "chispa>=0.10", # DataFrame equality assertions
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakehouse"]
