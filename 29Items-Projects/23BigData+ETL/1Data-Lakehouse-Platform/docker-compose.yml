# Local development stack — dev parity with the AWS deployment:
#   MinIO ≈ S3, Kafka ≈ MSK, Postgres ≈ RDS, Trino ≈ Trino on EKS, Airflow ≈ MWAA.
# Spark runs from pip (pyspark + delta-spark) or the lakehouse-spark image —
# no cluster needed locally.
#
#   docker compose up -d --build && bash scripts/bootstrap_local.sh

services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/lakehouse-bronze local/lakehouse-silver local/lakehouse-gold local/lakehouse-artifacts &&
      echo 'lake buckets ready'
      "

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # smoke test creates ad-hoc topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"   # host access; in-network clients use kafka:9092
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  trino:
    image: trinodb/trino:455
    ports:
      - "8081:8080"
    volumes:
      - ./infra/docker/trino/catalog:/etc/trino/catalog:ro
    # Local Trino serves the postgres federation catalog (catalogdb). The
    # delta catalog (infra/docker/trino/catalog-aws/) needs a Glue/Hive
    # metastore and is deployed with the AWS cluster instead.

  airflow:
    image: apache/airflow:2.9.3-python3.11
    command: standalone   # single-process dev Airflow; admin password in logs
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    ports:
      - "8085:8080"   # 8080 is commonly taken on dev machines
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags:ro
      - airflow-data:/opt/airflow
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .                       # repo root: the image ships migrations
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://lakehouse:lakehouse@postgres:5432/catalog
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      KAFKA_AUDIT_ENABLED: "true"      # fan audit events out to platform.audit.v1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  minio-data:
  kafka-data:
  pg-data:
  airflow-data:
