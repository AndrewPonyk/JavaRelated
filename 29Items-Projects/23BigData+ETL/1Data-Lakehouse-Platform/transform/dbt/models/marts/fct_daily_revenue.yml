version: 2

models:
  - name: fct_daily_revenue
    description: One row per day and currency; recognized (paid/shipped) revenue.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [revenue_date, currency]
    columns:
      - name: revenue_date
        tests: [not_null]
      - name: currency
        tests: [not_null]
      - name: gross_revenue
        tests: [not_null]
      - name: order_count
        tests: [not_null]
