  deploy-staging:
    needs: deploy-dev
    if: github.event_name == 'push' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "TODO — mirror of deploy-dev against staging + Playwright E2E smoke suite"

  deploy-prod:
    needs: deploy-staging
    if: github.event_name == 'push' || inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production # requires manual approval (GitHub environment protection)
