# Dashboard provider — loads JSON dashboards mounted at /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: rtap
    folder: RTAP
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
